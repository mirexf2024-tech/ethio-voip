name: Ethio Call Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy Socket.IO client
        run: npm run copy:socket

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS"
          ]

          for permission in permissions:
              line = f'<uses-permission android:name="{permission}" />'
              if line not in s:
                  s = s.replace(
                      "<application",
                      f"    {line}\n    <application",
                      1
                  )

          p.write_text(s)
          PY

      - name: Install native audio route plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path("android/app/src/main/java/com/mirexf2024/ethiocall")
          base.mkdir(parents=True, exist_ok=True)
          plugin = base / "AudioRoutePlugin.java"
          plugin.write_text("""package com.mirexf2024.ethiocall;

          import android.content.Context;
          import android.media.AudioDeviceInfo;
          import android.media.AudioManager;
          import android.os.Build;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AudioRoute")
          public class AudioRoutePlugin extends Plugin {
              @PluginMethod
              public void setSpeaker(PluginCall call) {
                  boolean enabled = Boolean.TRUE.equals(call.getBoolean("enabled"));
                  AudioManager manager = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                  manager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                  boolean routed = false;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      int wanted = enabled ? AudioDeviceInfo.TYPE_BUILTIN_SPEAKER : AudioDeviceInfo.TYPE_BUILTIN_EARPIECE;
                      for (AudioDeviceInfo device : manager.getAvailableCommunicationDevices()) {
                          if (device.getType() == wanted) {
                              routed = manager.setCommunicationDevice(device);
                              break;
                          }
                      }
                  }
                  if (!routed && Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      manager.setSpeakerphoneOn(enabled);
                      routed = true;
                  }
                  if (!routed) {
                      call.reject("Requested audio output is unavailable");
                      return;
                  }
                  call.resolve();
              }

              @PluginMethod
              public void reset(PluginCall call) {
                  AudioManager manager = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) manager.clearCommunicationDevice();
                  manager.setSpeakerphoneOn(false);
                  manager.setMode(AudioManager.MODE_NORMAL);
                  call.resolve();
              }
          }
          """)

          activity = Path("android/app/src/main/java/com/mirexf2024/ethiocall/MainActivity.java")
          code = activity.read_text()
          if "AudioRoutePlugin.class" not in code:
              code = code.replace(
                  "public class MainActivity extends BridgeActivity {",
                  "public class MainActivity extends BridgeActivity {" + chr(10) + "    @Override" + chr(10) + "    public void onCreate(android.os.Bundle savedInstanceState) {" + chr(10) + "        registerPlugin(AudioRoutePlugin.class);" + chr(10) + "        super.onCreate(savedInstanceState);" + chr(10) + "    }"
              )
              activity.write_text(code)
          PY

      - name: Restore permanent signing key
        env:
          KEY_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          test -n "$KEY_DATA"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          printf '%s' "$KEY_DATA" | base64 --decode > ethio-call-upload-key.jks

          keytool -list \
            -keystore ethio-call-upload-key.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Sign Release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/ethio-call-release.apk"

          test -f "$UNSIGNED_APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          test -n "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks ethio-call-upload-key.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ethio-call-signed-release-apk
          path: android/app/build/outputs/apk/release/ethio-call-release.apk
          retention-days: 30
