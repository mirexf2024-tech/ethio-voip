name: Ethio Call Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy Socket.IO browser client
        run: npm run copy:socket

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS"
          ]

          for permission in permissions:
              line = f'<uses-permission android:name="{permission}" />'
              if line not in s:
                  s = s.replace("<application", f"    {line}\n    <application", 1)

          p.write_text(s)
          PY

      - name: Restore signing key
        env:
          KEY_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          printf '%s' "$KEY_DATA" | tr -d '[:space:]' | base64 --decode > android/ethio-call-upload-key.jks
          test -s android/ethio-call-upload-key.jks

      - name: Verify signing key
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore android/ethio-call-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Configure Android signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "signingConfigs {" not in s:
              signing = """
              signingConfigs {
                  release {
                      storeFile file("../ethio-call-upload-key.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              """
              s = s.replace("android {", "android {\n" + signing, 1)

          if "signingConfig signingConfigs.release" not in s:
              pattern = r"(buildTypes\s*\{)"
              s, count = re.subn(
                  pattern,
                  r'\1\n        release {\n            signingConfig signingConfigs.release\n        }',
                  s,
                  count=1
              )
              if count != 1:
                  raise Exception("Android buildTypes block not found")

          p.write_text(s)
          PY

      - name: Build signed Release APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ethio-call-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
