<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethio VoIP Test</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0 auto;padding:16px;background:#111;color:#eee;max-width:480px}
  h1{font-size:20px;margin:4px 0 12px}
  input,button{font-size:16px;padding:12px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;width:100%;box-sizing:border-box;margin:6px 0}
  button{background:#2563eb;border:none;font-weight:600}
  button.red{background:#dc2626}
  button.green{background:#16a34a}
  button.gray{background:#444}
  .card{background:#1b1b1b;border-radius:12px;padding:12px;margin:12px 0}
  .big{font-size:22px;font-weight:700}
  .small{font-size:13px;color:#aaa}
  #log{white-space:pre-wrap;font-size:12px;color:#aaa;max-height:220px;overflow:auto}
</style>
</head>
<body>
<h1>Ethio VoIP - Test</h1>

<div id="login" class="card">
  <div class="small">1. Enter your phone, tap "Get code", then "Login"</div>
  <input id="phone" type="tel" placeholder="+2519XXXXXXXX" value="+251973355691">
  <button id="btnOtp">Get code</button>
  <input id="code" type="tel" placeholder="Code (auto-filled in dev)">
  <button id="btnLogin" class="green">Login</button>
</div>

<div id="app" style="display:none">
  <div class="card">
    <div class="small">Logged in as</div>
    <div class="big" id="me"></div>
    <div>Coins: <b id="coins">0</b></div>
    <button id="btnBuy" class="gray">Get 30 free test coins</button>
  </div>

  <div id="dial" class="card">
    <div class="small">Phone number to call (must be logged in on another phone)</div>
    <input id="callee" type="tel" placeholder="+2519XXXXXXXX">
    <button id="btnCall" class="green">Call</button>
    <div class="small" id="last"></div>
  </div>

  <div id="incoming" class="card" style="display:none">
    <div class="small">Incoming call from</div>
    <div class="big" id="from"></div>
    <button id="btnAccept" class="green">Accept</button>
    <button id="btnReject" class="red">Reject</button>
  </div>

  <div id="incall" class="card" style="display:none">
    <div class="big" id="status">Calling...</div>
    <div class="big" id="clock">00:00</div>
    <button id="btnMute" class="gray">Mute</button>
    <button id="btnEnd" class="red">End call</button>
  </div>
</div>

<div class="card"><div class="small">Log</div><div id="log"></div></div>
<audio id="remote" autoplay playsinline></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var show = function (id, on) { $(id).style.display = on ? 'block' : 'none'; };
var token = null, socket = null, pc = null, localStream = null;
var callId = null, pendingIce = [], timer = null, t0 = 0;
var iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];

function log(m) {
  $('log').textContent = new Date().toLocaleTimeString() + '  ' + m + '\n' + $('log').textContent;
}

async function api(path, method, body) {
  var headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  var res = await fetch(path, {
    method: method || 'GET',
    headers: headers,
    body: body ? JSON.stringify(body) : undefined
  });
  return res.json();
}

async function refreshCoins() {
  var r = await api('/wallet');
  if (r.coins !== undefined) $('coins').textContent = r.coins;
}

function ui(state, text) {
  show('dial', state === 'idle');
  show('incoming', state === 'incoming');
  show('incall', state === 'ringing' || state === 'active');
  if (text) $('status').textContent = text;
}

function startClock() {
  t0 = Date.now();
  clearInterval(timer);
  timer = setInterval(function () {
    var s = Math.floor((Date.now() - t0) / 1000);
    var mm = String(Math.floor(s / 60)).padStart(2, '0');
    var ss = String(s % 60).padStart(2, '0');
    $('clock').textContent = mm + ':' + ss;
  }, 500);
}

function cleanup() {
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(function (t) { t.stop(); }); localStream = null; }
  $('remote').srcObject = null;
  clearInterval(timer); timer = null;
  $('clock').textContent = '00:00';
  $('btnMute').textContent = 'Mute';
  callId = null; pendingIce = [];
  ui('idle');
  refreshCoins();
}

async function prepareMedia() {
  localStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true }
  });
}

function createPeer() {
  pc = new RTCPeerConnection({ iceServers: iceServers });
  localStream.getTracks().forEach(function (t) { pc.addTrack(t, localStream); });
  pc.ontrack = function (e) {
    $('remote').srcObject = e.streams[0];
    $('remote').play().catch(function () {});
  };
  pc.onicecandidate = function (e) {
    if (e.candidate) socket.emit('webrtc:ice', { callId: callId, candidate: e.candidate });
  };
  pc.onconnectionstatechange = function () { log('connection: ' + pc.connectionState); };
}

async function flushIce() {
  for (var i = 0; i < pendingIce.length; i++) {
    try { await pc.addIceCandidate(pendingIce[i]); } catch (e) {}
  }
  pendingIce = [];
}

function connectSocket() {
  socket = io({ auth: { token: token } });

  socket.on('connect', function () { log('server connected'); });
  socket.on('connect_error', function (e) { log('socket error: ' + e.message); });

  socket.on('call:ringing', function (d) { callId = d.callId; ui('ringing', 'Ringing...'); });

  socket.on('call:incoming', function (d) {
    callId = d.callId;
    $('from').textContent = d.from.name ? d.from.name + ' (' + d.from.phone + ')' : d.from.phone;
    ui('incoming');
  });

  // caller: other person answered -> create the offer
  socket.on('call:accepted', async function () {
    if (!pc) return;
    ui('active', 'Connected');
    startClock();
    var offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('webrtc:offer', { callId: callId, sdp: pc.localDescription });
  });

  socket.on('webrtc:offer', async function (d) {
    if (!pc) return;
    await pc.setRemoteDescription(d.sdp);
    await flushIce();
    var answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('webrtc:answer', { callId: callId, sdp: pc.localDescription });
  });

  socket.on('webrtc:answer', async function (d) {
    if (!pc) return;
    await pc.setRemoteDescription(d.sdp);
    await flushIce();
  });

  socket.on('webrtc:ice', async function (d) {
    if (!pc) return;
    if (pc.remoteDescription) {
      try { await pc.addIceCandidate(d.candidate); } catch (e) {}
    } else {
      pendingIce.push(d.candidate);
    }
  });

  socket.on('call:charged', function (d) { $('coins').textContent = d.balance; log('charged, balance: ' + d.balance); });
  socket.on('call:low_balance', function () { log('LOW COINS - call will end soon'); });

  socket.on('call:ended', function (d) {
    var msg = 'Last call: ' + d.reason + ', ' + d.seconds + 's, ' + d.coinsCharged + ' coins';
    log(msg);
    cleanup();
    $('last').textContent = msg;
  });

  socket.on('call:error', function (d) {
    log('ERROR: ' + d.message);
    alert(d.message);
    cleanup();
  });
}

$('btnOtp').onclick = async function () {
  var r = await api('/auth/request-otp', 'POST', { phone: $('phone').value });
  if (r.devCode) $('code').value = r.devCode;
  log(JSON.stringify(r));
};

$('btnLogin').onclick = async function () {
  var r = await api('/auth/verify-otp', 'POST', { phone: $('phone').value, code: $('code').value });
  if (!r.token) { log(JSON.stringify(r)); return; }
  token = r.token;
  $('me').textContent = r.user.phone;
  show('login', false);
  show('app', true);
  await refreshCoins();
  try {
    var ice = await api('/ice');
    if (ice.iceServers) iceServers = ice.iceServers;
  } catch (e) {}
  connectSocket();
};

$('btnBuy').onclick = async function () {
  var r = await api('/wallet/dev-buy', 'POST', { package_id: 1 });
  log(JSON.stringify(r));
  refreshCoins();
};

$('btnCall').onclick = async function () {
  try {
    await prepareMedia();
    createPeer();
    socket.emit('call:start', { toPhone: $('callee').value });
    ui('ringing', 'Calling...');
  } catch (e) {
    log('Microphone error: ' + e.message);
    alert('Allow the microphone to make calls');
    cleanup();
  }
};

$('btnAccept').onclick = async function () {
  try {
    await prepareMedia();
    createPeer();
    socket.emit('call:accept', { callId: callId });
    ui('active', 'Connecting...');
    startClock();
  } catch (e) {
    log('Microphone error: ' + e.message);
    alert('Allow the microphone to answer calls');
    socket.emit('call:reject', { callId: callId });
    cleanup();
  }
};

$('btnReject').onclick = function () { socket.emit('call:reject', { callId: callId }); cleanup(); };
$('btnEnd').onclick = function () { socket.emit('call:end', { callId: callId }); };

$('btnMute').onclick = function () {
  if (!localStream) return;
  var t = localStream.getAudioTracks()[0];
  t.enabled = !t.enabled;
  $('btnMute').textContent = t.enabled ? 'Mute' : 'Unmute';
};
</script>
</body>
</html>
