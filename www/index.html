<title>Ethio Call</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111;max-width:480px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#0f766e;color:#fff;font-weight:700}
.pill{background:#ffffff33;border-radius:99px;padding:4px 12px;font-size:14px}
.pg{padding:16px 16px calc(90px + var(--adh,0px))}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
input,select{width:100%;font-size:17px;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0;background:#fff;color:#111}
button{font-size:17px;padding:13px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:600;width:100%;margin:6px 0}
button.g{background:#16a34a}button.r{background:#dc2626}button.x{background:#e5e7eb;color:#111}
.nav{position:fixed;bottom:var(--adh,0px);left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-top:1px solid #e5e7eb;padding-bottom:env(safe-area-inset-bottom)}
.nav div{flex:1;text-align:center;padding:10px 0;font-size:12px;color:#6b7280;position:relative}
.nav .on{color:#0f766e;font-weight:700}
.nav .dot{position:absolute;top:4px;left:56%;background:#dc2626;color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{background:#fff;color:#111;border:1px solid #e5e7eb;font-size:22px;margin:0}
.num{font-size:26px;text-align:center;min-height:40px;letter-spacing:1px;word-break:break-all}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.row:last-child{border:0}
.row button{width:auto;padding:8px 16px;margin:0;flex:none}
.row .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:60vw}
a.btn{display:block;text-align:center;text-decoration:none;font-size:17px;padding:13px;border-radius:10px;background:#229ED9;color:#fff;font-weight:600;margin:6px 0}
.av{width:96px;height:96px;border-radius:50%;background:#99f6e4;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:38px;color:#0f766e;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:44px;height:44px;font-size:18px;margin:0;flex:none}
.big{font-size:38px;font-weight:800;text-align:center}
.s{font-size:13px;color:#6b7280}
.c{text-align:center}
.badge{background:#dc2626;color:#fff;border-radius:99px;padding:2px 8px;font-size:12px;flex:none}
.rt{display:inline-block;background:#d1fae5;color:#065f46;border-radius:6px;padding:0 6px;font-size:11px;margin-left:4px;font-weight:600}
.rt.m{background:#fee2e2;color:#b91c1c}
.ov{position:fixed;inset:0;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;z-index:9}
.ov button{max-width:320px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:90%}
.ban{background:#f59e0b;color:#000;text-align:center;font-size:13px;padding:4px}
.chatv{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#e5ddd5;display:flex;flex-direction:column;z-index:5}
.chatv .top span{cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:10px}
.mr{display:flex;justify-content:flex-start}
.mr.me{justify-content:flex-end}
.b{max-width:82%;padding:8px 10px;border-radius:12px;margin:3px 0;background:#fff;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.mr.me .b{background:#d9fdd3}
.pic{max-width:100%;max-height:260px;border-radius:8px;display:block}
.ph{padding:30px 20px;background:#eee;border-radius:8px;text-align:center;color:#555}
.pl{background:#0f766e;font-size:15px;padding:8px 14px;width:auto;margin:0}
.comp{display:flex;gap:6px;align-items:center;padding:8px;background:#f0f0f0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.comp input{margin:0;flex:1;min-width:0}
.comp button{width:auto;margin:0;padding:11px 14px;flex:none}
.ic{font-size:24px;padding:4px;cursor:pointer}
#vwrap{position:fixed;inset:0;background:#000;z-index:8;visibility:hidden}
#vwrap.on{visibility:visible}
#rv{width:100%;height:100%;object-fit:cover;background:#000}
#lv{position:absolute;right:12px;top:12px;width:96px;height:128px;object-fit:cover;border-radius:12px;background:#222;border:2px solid #fff3;transform:scaleX(-1)}
.ov.vid{background:transparent;justify-content:space-between;padding:48px 24px 32px}
#adbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e5e7eb;z-index:4;visibility:hidden}
body.ad #adbar{visibility:visible}
#adbar iframe{width:100%;border:0;display:block;height:100px}
#adbar .s{font-size:10px;text-align:center;line-height:14px}

/* Native first-launch welcome screen — isolated from the live web app */
.ec-welcome{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));color:#fff;background:radial-gradient(ellipse at 50% 43%,#1762c7 0%,#073d91 43%,#031b4b 100%)}
.ec-welcome:before{content:"";position:absolute;inset:0;opacity:.16;background-image:radial-gradient(#fff 0.7px,transparent .7px);background-size:18px 18px;mask-image:linear-gradient(to bottom,transparent,#000 35%,#000 80%,transparent)}
.ec-welcome-lang{position:relative;z-index:2;align-self:flex-end;width:155px}.ec-welcome-lang select{margin:0;background:#ffffff18;color:#fff;border:1px solid #ffffff55;font-size:14px}.ec-welcome-lang option{color:#111}
.ec-welcome-brand{position:relative;z-index:1;text-align:center;margin-top:clamp(25px,6vh,58px)}
.ec-mark{height:112px;display:flex;align-items:center;justify-content:center;position:relative;color:#fff}.ec-mark span{font-size:76px;line-height:1;transform:rotate(-18deg)}.ec-mark i{font-style:normal;font-size:38px;margin-left:-9px;margin-top:35px}.ec-mark b{position:absolute;top:0;right:calc(50% - 90px);font-size:34px;letter-spacing:-8px;color:#ffdc16;transform:rotate(-35deg)}
.ec-wordmark{font-size:clamp(32px,9vw,44px);font-weight:900;letter-spacing:1px}.ec-wordmark strong{color:#ffdc16}.ec-tagline{font-size:17px;font-weight:600;letter-spacing:1px;color:#e7efff;margin-top:4px}
.ec-hero-art{position:relative;flex:1;min-height:190px;display:flex;align-items:center;justify-content:center;overflow:visible;padding:8px 0}.ec-hero-image{display:block;width:min(100%,410px);height:auto;max-height:clamp(190px,36vh,340px);object-fit:contain;filter:drop-shadow(0 15px 22px #00153b66);position:relative;z-index:1}.ec-orbit{position:absolute;border:1px solid #ffffff22;border-radius:50%;width:min(72vw,300px);height:min(72vw,300px)}.ec-orbit-a{transform:scaleY(.42) rotate(-22deg)}.ec-orbit-b{transform:scaleY(.7) rotate(28deg)}
.ec-welcome-bottom{position:relative;z-index:1;text-align:center;margin:auto 0 0}.ec-welcome-bottom h1{font-size:clamp(18px,5vw,22px);line-height:1.45;font-weight:600;margin:0 auto 18px;max-width:340px;color:#f7faff}.ec-start,.ec-login{max-width:350px;margin:7px auto;border-radius:30px;min-height:54px;font-size:18px}.ec-start{background:#ffdc16;color:#06285f;box-shadow:0 7px 18px #00163e66}.ec-login{background:transparent;color:#fff;border:1.5px solid #ffffffbb}.ec-foot{font-size:10px;letter-spacing:2px;color:#b9cfff;margin-top:17px}
@media(max-height:650px){.ec-welcome-brand{margin-top:12px}.ec-mark{height:75px}.ec-mark span{font-size:58px}.ec-hero-art{min-height:110px}.ec-globe{font-size:72px}.ec-welcome-bottom h1{margin-bottom:8px}.ec-start,.ec-login{min-height:46px;margin:4px auto}}

/* Ethio Call native app visual system: deep blue + gold */
:root{--ec-navy:#062b68;--ec-blue:#0755ad;--ec-gold:#f5c928;--ec-bg:#f2f6fc}
body{background:var(--ec-bg);color:#12213a}
.top{background:linear-gradient(110deg,var(--ec-navy),var(--ec-blue));color:#fff;box-shadow:0 3px 12px #062b6822}
.pill{background:#ffffff20;border:1px solid #ffffff35}
.card{border:1px solid #e3eaf5;border-radius:17px;box-shadow:0 5px 18px #102f5c0b}
button{background:var(--ec-blue);border-radius:13px;min-height:46px}
button.g{background:#087b58}
button.x{background:#eaf0f8;color:#17365f}
button.r{background:#c83232}
.nav{background:#fff;border-top:1px solid #e2e9f3;box-shadow:0 -5px 18px #102f5c0c}
.nav div{color:#78869b;padding:11px 0 calc(10px + env(safe-area-inset-bottom));font-weight:600}
.nav .on{color:var(--ec-blue)}
.nav .on:after{content:"";position:absolute;top:0;left:34%;right:34%;height:3px;border-radius:0 0 4px 4px;background:var(--ec-gold)}
.row{border-bottom:1px solid #edf1f7;padding:11px 2px}
.row:last-child{border-bottom:0}
input,select{border-color:#dce5f1;border-radius:12px}
input:focus,select:focus{outline:2px solid #0755ad33;border-color:var(--ec-blue)}
.badge,.nav .dot{background:#e4b900;color:#14294a;font-weight:800}


/* Free accessibility controls */
body.ec-large{font-size:19px}body.ec-large input,body.ec-large select,body.ec-large button{font-size:19px}
body.ec-big button,body.ec-big .nav div{min-height:58px;padding-top:16px;padding-bottom:16px}

body.ec-dark{background:#071426!important;color:#e8eef8!important}
body.ec-dark .card,body.ec-dark .nav{background:#10223b!important;color:#e8eef8!important;border-color:#263c59!important}
body.ec-dark input,body.ec-dark select{background:#0b1a2d!important;color:#f5f7fb!important;border-color:#334b6c!important}
body.ec-dark .row{border-color:#263c59!important}
body.ec-dark .nav .on{color:#ffd83d!important}
body.ec-dark .s{color:#aebbd0!important}
body.ec-dark .chatv{background:#0a1728!important}
body.ec-dark .msgs{background:#0a1728!important}
body.ec-dark .mr .b{background:#152b46!important;color:#f3f6fc!important}
body.ec-dark .mr.me .b{background:#173c42!important}
body.ec-dark .comp{background:#10223b!important}

</style>

};

function beep(len) {
  if (!actx) return;
  var o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = 440; g.gain.value = 0.15;
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + (len || 0.4));
}
function buzz(ms) { if (S.set.vibrate && navigator.vibrate) navigator.vibrate(ms); }
function ringStart() {
  ringStop();
  if (S.set.sound) beep();
  ringT = setInterval(function () { if (S.set.sound) beep(); buzz(300); }, 1500);
}
function ringStop() { clearInterval(ringT); ringT = null; }

// ringback: what the CALLER hears while the other phone rings.
// Put your own ringback.mp3 in the repo to replace this standard tone (1 s tone, 4 s silence).
var rbT = null, rbOsc = null, rbAudio = null;
function rbSynth() {
  if (!actx) return;
  var once = function () {
    var o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 425; g.gain.value = 0.12;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 1);
    rbOsc = o;
  };
  once(); rbT = setInterval(once, 5000);
}
function rbStart() {
  rbStop();
  if (!S.set.sound) return;
  var a = new Audio(API_BASE + '/sounds/ringback.mp3');
  a.loop = true; rbAudio = a;
  var fallback = function () { if (rbAudio === a) { rbAudio = null; rbSynth(); } };
  a.onerror = fallback;
  a.play().catch(fallback);
}
function rbStop() {
  if (rbAudio) { rbAudio.pause(); rbAudio = null; }
  clearInterval(rbT); rbT = null;
  if (rbOsc) { try { rbOsc.stop(); } catch (e) {} rbOsc = null; }
}

// status announcements (like the network voice): plays /sounds/<key>-<lang>.mp3 if you uploaded it,
// otherwise the phone's own voice (only if it has one for this language), and always shows the text
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  var lang = {om: 'om', am: 'am', en: 'en'}[S.lang];
  var v = (speechSynthesis.getVoices() || []).filter(function (x) {
    return x.lang && x.lang.toLowerCase().indexOf(lang) === 0;
  })[0];
  if (!v) return;
  var u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang;
  speechSynthesis.speak(u);
}
function readMessage(btn) {
  var text = btn && btn.getAttribute('data-read');
  if (!text) return;
  if (!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance) return toast(({om:'Sagaleen dubbisuu bilbila kana irratti hin deeggaramu.',am:'የድምፅ ንባብ በዚህ ስልክ አይደገፍም።',en:'Read aloud is not supported on this phone.'})[S.lang]);
  var prefix = ({om:'om',am:'am',en:'en'})[S.lang] || 'en';
  function useVoice() {
    var voices = speechSynthesis.getVoices() || [];
    var voice = voices.filter(function(v){return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0;})[0];
    if (!voice) return false;
    try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.voice = voice; u.lang = voice.lang; speechSynthesis.speak(u); return true; }
    catch(e) { toast('Could not read this message.'); return true; }
  }
  if (useVoice()) return;
  var waiting = false;
  var onVoices = function() {
    if (waiting) return; waiting = true;
    if (window.speechSynthesis.removeEventListener) speechSynthesis.removeEventListener('voiceschanged', onVoices);
    if (!useVoice()) toast(({om:'Sagaleen Afaan Oromoo bilbila kana irratti hin argamne.',am:'የአማርኛ ድምፅ በዚህ ስልክ ላይ አልተገኘም።',en:'No voice for this language is installed on this phone.'})[S.lang],5000);
  };
  if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', onVoices, {once:true});
  setTimeout(onVoices, 1200);
}
var activeDictation = null;
function stopDictation() {
  if (activeDictation) { try { activeDictation.stop(); } catch(e) {} activeDictation = null; }
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch(e) {} }
}
function startDictation() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('Speech recognition is not supported in this browser.');
  if (S.recording || S.call) return toast('Finish the current recording or call first.');
  if (activeDictation) return toast('Speech input is already running.');
  var rec = new SR(), lang = ({om:'om-ET',am:'am-ET',en:'en-US'})[S.lang] || 'en-US';
  activeDictation = rec;
  rec.lang = lang; rec.continuous = false; rec.interimResults = true;
  var input = $('mi'); if (!input) return;
  var base = input.value || ''; var finalText = '';
  rec.onresult = function(e) {
    var interim = '';
    for (var i=e.resultIndex; i<e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    input.value = (base ? base + ' ' : '') + finalText + interim;
    S.d_mi = input.value;
  };
  rec.onerror = function(e) {
    var msg = e.error === 'not-allowed' ? 'Microphone permission was denied.' : 'Speech recognition failed or this language is not supported.';
    toast(msg,5000);
  };
  rec.onend = function(){ if (input) S.d_mi = input.value; if (activeDictation === rec) activeDictation = null; };
  toast(({om:'Dubbachuun barruutti jijjiirama. Sagaleen tajaajila browseriin qoratamuu danda’a.',am:'ንግግርዎ ወደ ጽሑፍ ይቀየራል። ድምፅዎ በአሳሹ አገልግሎት ሊሰራ ይችላል።',en:'Speak to enter text. Audio may be processed by your browser provider.'})[S.lang],5500);
  try { rec.start(); } catch(e) { toast('Could not start speech recognition.'); }
}

function announce(key) {
  var text = t('ann_' + key);
  toast(text, 7000);
  var exts = ['mp3', 'm4a', 'ogg', 'wav'], i = 0;
  (function next() {
    if (i >= exts.length) return speak(text);
    var a = new Audio(API_BASE + '/sounds/' + key + '-' + S.lang + '.' + exts[i++]);
    var moved = false;
    var fail = function () { if (!moved) { moved = true; next(); } };
    a.onerror = fail;
    a.play().catch(fail);
  })();
}
function notify(title, body) {
  if (IS_NATIVE_APP) return;
  if (!document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
  navigator.serviceWorker.ready.then(function (r) {
    r.showNotification(title, {body: body, icon: '/icon-192.png', tag: 'ethio'});
  }).catch(function () { try { new Notification(title, {body: body}); } catch (e) {} });
}
function b64ToU8(b64) {
  var pad = '='.repeat((4 - b64.length % 4) % 4);
  var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
function pushReady() { return !IS_NATIVE_APP && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function swReady() {
  return Promise.race([navigator.serviceWorker.ready, new Promise(function (_, rej) { setTimeout(rej, 5000); })]);
}
// subscribe this phone to push (only if the user already allowed notifications)
async function pushOn() {
  if (!pushReady() || Notification.permission !== 'granted') return false;
  try {
    var reg = await swReady();
    var sub = await reg.pushManager.getSubscription();
    if (!sub) {
      var k = await (await fetch(API_BASE + '/push/key')).json();
      if (!k.key) return false;
      sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64ToU8(k.key)});
    }
    var r = await api('/push/subscribe', 'POST', {subscription: sub.toJSON()});
    return !!r.ok;
  } catch (e) { return false; }
}
// forget this phone (used when logging out, so the next person does not get your calls)
var nativePushListenersReady = false;
async function nativePushOn() {
  if (!IS_NATIVE_APP) return false;
  var plugin = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
  if (!plugin) return false;
  try {
    if (!nativePushListenersReady) {
      nativePushListenersReady = true;
      try {
        await plugin.createChannel({
          id: 'ethio_calls',
          name: 'Ethio Call alerts',
          description: 'Incoming calls and new messages',
          importance: 5,
          visibility: 1,
          sound: 'default',
          vibration: true
        });
      } catch (e) {}
      await plugin.addListener('registration', function (token) {
        if (token && token.value) {
          try { localStorage.setItem('ec_fcm_token', token.value); } catch (e) {}
          api('/push/register-token', 'POST', {token: token.value});
        }
      });
      await plugin.addListener('registrationError', function () {});
      await plugin.addListener('pushNotificationReceived', function (notification) {
        if (notification && notification.title) toast(notification.title + (notification.body ? ': ' + notification.body : ''), 5000);
      });
      await plugin.addListener('pushNotificationActionPerformed', function () {
        S.tab = 'calls'; render();
      });
    }
    var permission = await plugin.checkPermissions();
    if (permission.receive !== 'granted') permission = await plugin.requestPermissions();
    if (permission.receive !== 'granted') return false;
    await plugin.register();
    return true;
  } catch (e) { return false; }
}
async function pushOff() {
  if (IS_NATIVE_APP) {
    try {
      var currentToken = localStorage.getItem('ec_fcm_token');
      if (currentToken) await api('/push/unregister-token', 'POST', {token: currentToken});
    } catch (e) {}
    return;
  }
  if (!pushReady()) return;
  try {
    var reg = await swReady();
    var sub = await reg.pushManager.getSubscription();
    if (sub) { await api('/push/unsubscribe', 'POST', {endpoint: sub.endpoint}); await sub.unsubscribe(); }
  } catch (e) {}
}
async function askNotif() {
  if (!pushReady()) return toast('Not supported');
  var p = await Notification.requestPermission();
  if (p !== 'granted') { toast(t('off')); return render(); }
  var ok = await pushOn();
  toast(ok ? t('on') : t('notifFail'));
}
async function testPush() {
  var r = await api('/push/test', 'POST');
  toast(r.sent ? t('on') : t('notifFail'));
}

var adShown = '', adBusy = false;

function syncAd() {
  var a = S.ads, f = $('adf');
  var on = !!(S.me && a && a.banner && S.tab !== 'settings');
  if (a && a.banner && f) {
    var key = a.height + '|' + a.banner;
    if (adShown !== key) {
      adShown = key;
      f.style.height = a.height + 'px';
      // the ad lives in its own sandboxed frame: it can never read your login token
      f.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:0;background:#fff}body{display:flex;justify-content:center;align-items:center;min-height:' + a.height + 'px}</style></head><body>' + a.banner + '</body></html>';
    }
  }
  document.body.classList.toggle('ad', on);
  document.body.style.setProperty('--adh', on ? (a.height + 14) + 'px' : '0px');
}

function syncVideo() {
  var on = !!(S.call && S.call.video && S.call.state !== 'incoming');
  var w = $('vwrap'); if (w) w.className = on ? 'on' : '';

async function loadAds() {
  var r = await api('/ads/config');
  if (r && r.reward) S.ads = r;
}

function rewardCard() {
  var a = S.ads && S.ads.reward;
  if (!a || !a.on || !(window.EthioNative && window.EthioNative.showRewarded)) return '';
  return `<div class="card">${a.left > 0
    ? `<button class="g" onclick="watchAd()">${t('watch')} (+${a.coins})</button><div class="s c">${t('watchLeft').replace('{n}', a.left)}</div>`
    : `<div class="s c">${t('watchDone')}</div>`}</div>`;
}

// the Android app (Start.io SDK) must offer EthioNative.showRewarded() and call window.onEthioRewarded(true|false)
function rewardedVideo() {
  return new Promise(function (resolve) {
    var fin = false;
    var done = function (ok) { if (fin) return; fin = true; window.onEthioRewarded = null; resolve(!!ok); };
    window.onEthioRewarded = done;
    setTimeout(function () { done(false); }, 180000);
    try { window.EthioNative.showRewarded(); } catch (e) { done(false); }
  });
}

async function watchAd() {
  if (adBusy) return;
  adBusy = true;
  try {
    var st = await api('/ads/reward/start', 'POST');
    if (!st.ok) return toast(st.error || 'Error');
    var ok = await rewardedVideo();
    if (!ok) return toast(t('adNotReady'));
    var c = await api('/ads/reward/claim', 'POST', {id: st.id});
    if (!c.ok) return toast(c.error || 'Error');
    S.coins = c.coins;
    await loadAds(); await loadWallet(); render();
    toast(t('adThanks') + ' +' + c.added + ' 🪙', 4000);
  } finally { adBusy = false; }
}

  var mk = (g ? 'g' : '') + m.id;               // key of the photo/voice/file in the cache

function toDataURL(b) {
  return new Promise(function (res, rej) {
    var f = new FileReader(); f.onload = function () { res(f.result); }; f.onerror = rej; f.readAsDataURL(b);
  });
}

function compressImage(f) {
  return new Promise(function (res, rej) {
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, 1280 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { b ? res(b) : rej(new Error('img')); }, 'image/jpeg', 0.7);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = rej; img.src = URL.createObjectURL(f);
  });
}

async function pickFile(inp, kind) {
  var f = inp.files[0]; inp.value = ''; if (!f) return;
  try {
    var blob = f, k = 'file';
    if (kind === 'image' && f.type.indexOf('image/') === 0) { blob = await compressImage(f); k = 'image'; }
    if (blob.size > 1000000) return toast(t('tooBig'));
    toast(t('sending'));
    await postMsg({kind: k, data: await toDataURL(blob), name: f.name, size: blob.size}, blob);
  } catch (e) { toast('Error'); }
}

async function voiceStart() {
  if (S.call) return toast(t('mic'));
  try { VR.stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch (e) { return toast(t('mic')); }
  var mt = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(function (m) {
    return window.MediaRecorder && MediaRecorder.isTypeSupported(m);
  });
  var opts = {audioBitsPerSecond: 24000}; if (mt) opts.mimeType = mt;
  VR.mr = new MediaRecorder(VR.stream, opts);
  VR.chunks = []; VR.cancel = false;
  VR.mr.ondataavailable = function (e) { if (e.data && e.data.size) VR.chunks.push(e.data); };
  VR.mr.onstop = async function () {
    VR.stream.getTracks().forEach(function (tr) { tr.stop(); });
    clearInterval(VR.timer); S.recording = false;
    var secs = (Date.now() - VR.t0) / 1000;
    render();
    if (VR.cancel || !VR.chunks.length || !(S.chat || S.grp)) return;
    var blob = new Blob(VR.chunks, {type: VR.mr.mimeType || 'audio/webm'});
    if (blob.size > 1000000) return toast(t('tooBig'));
    await postMsg({kind: 'voice', data: await toDataURL(blob), size: blob.size, duration: Math.round(secs)}, blob);
  };
  VR.mr.start(); VR.t0 = Date.now(); S.recording = true; render();
  VR.timer = setInterval(function () {
    var e = $('rt'), ms = Date.now() - VR.t0;
    if (e) e.textContent = fmtDur(ms / 1000);
    if (ms > 120000) voiceStop(false);
  }, 500);
}
function voiceStop(cancel) {
  VR.cancel = !!cancel;
  if (VR.mr && VR.mr.state !== 'inactive') VR.mr.stop();
}

}

function closeGroup() { stopDictation(); S.grp = null; render(); loadGroups(); }

function grpInfo() {

async function refreshGroup() {

var RANKS = {owner: 4, admin: 3, mod: 2, member: 1};
function rankOf(role) { return RANKS[role] || 0; }

function canDelGMsg(m) {

}

function selMember(phone) { S.grp.sel = S.grp.sel === phone ? null : phone; render(); }

// one place for the buttons: ask the server, show its answer, reload the group

}

function setRole(phone, role) { return grpDo('/role', {phone: phone, role: role}); }
function muteM(phone, minutes) { return grpDo('/mute', minutes < 0 ? {phone: phone, forever: true} : {phone: phone, minutes: minutes}); }
function kickM(phone) { return grpDo('/kick', {phone: phone}, t('kickq')); }

/* ---------- calling ---------- */
function key(k) {
  if (k === '⌫') S.dial = S.dial.slice(0, -1);
  else if (S.dial.length < 16) S.dial += k;
  render();
}

function vidConstraints(face) {
  return {facingMode: face ? {ideal: face} : 'user', width: {ideal: S.set.saver ? 320 : 640}, height: {ideal: S.set.saver ? 240 : 480}, frameRate: {ideal: S.set.saver ? 15 : 24, max: 24}};
}

async function media(video) {
  localStream = await navigator.mediaDevices.getUserMedia({
    audio: {echoCancellation: true, noiseSuppression: true},
    video: video ? vidConstraints() : false
  });
  if (video) {
    var lv = $('lv'); lv.style.transform = ''; lv.srcObject = localStream; lv.play().catch(function () {});
  }
}

function mkPeer() {
  pc = new RTCPeerConnection({iceServers: iceServers});
  localStream.getTracks().forEach(function (tr) { pc.addTrack(tr, localStream); });
  pc.ontrack = function (e) {
    $('remote').srcObject = e.streams[0]; $('remote').play().catch(function () {});
    var rv = $('rv'); if (rv && S.call && S.call.video) { rv.srcObject = e.streams[0]; rv.play().catch(function () {}); }
  };
  pc.oniceconnectionstatechange = function () {
    if (S.call && pc) { S.call.ice = pc.iceConnectionState; render(); }
  };
  pc.onicecandidate = function (e) {
    if (e.candidate && S.call) socket.emit('webrtc:ice', {callId: S.call.id, candidate: e.candidate});
  };
}

async function flushIce() {
  for (var i = 0; i < pendingIce.length; i++) { try { await pc.addIceCandidate(pendingIce[i]); } catch (e) {} }
  pendingIce = [];
}

// low-data mode: ~16 kbps voice (about 0.12 MB per minute); otherwise 32 kbps
function limitBitrate() {
  try {
    pc.getSenders().forEach(function (sd) {
      if (!sd.track) return;
      var p = sd.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      if (sd.track.kind === 'audio') p.encodings[0].maxBitrate = S.set.saver ? 16000 : 32000;
      else if (sd.track.kind === 'video') { p.encodings[0].maxBitrate = S.set.saver ? 150000 : 400000; p.encodings[0].maxFramerate = S.set.saver ? 15 : 24; }
      else return;
      sd.setParameters(p).catch(function () {});
    });
  } catch (e) {}
}

function tick() {
  clearInterval(tickT);
  tickT = setInterval(function () {
    var e = $('clk');
    if (e && S.call && S.call.state === 'active') e.textContent = clock();
  }, 500);
}

function cleanup() {
  try {
    var audioRoute = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AudioRoute;
    if (IS_NATIVE_APP && audioRoute && audioRoute.reset) audioRoute.reset();
  } catch (e) {}
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(function (tr) { tr.stop(); }); localStream = null; }
  $('remote').srcObject = null; $('rv').srcObject = null; $('lv').srcObject = null;
  clearInterval(tickT); ringStop(); rbStop();
  S.call = null; pendingIce = [];
  render();
  loadWallet().then(render);
}

async function startCall(video) {
  if (!S.dial) return;
  video = video === true;
  unlock();
  if (!S.online) return toast(t('offline'));
  try {
    await media(video); mkPeer();
    S.call = {state: 'ringing', peer: S.dial, id: null, role: 'caller', video: video};
    addRecent(S.dial, 'out');
    socket.emit('call:start', {toPhone: S.dial, video: video});
    rbStart();
    render();
  } catch (e) { toast(t(video ? 'cam' : 'mic')); cleanup(); }
}

async function acceptCall() {
  ringStop();
  try {
    await media(!!S.call.video); mkPeer();
    socket.emit('call:accept', {callId: S.call.id});
    S.call.state = 'active'; S.call.t0 = Date.now();
    render(); tick();
  } catch (e) {
    toast(t(S.call && S.call.video ? 'cam' : 'mic'));
    socket.emit('call:reject', {callId: S.call.id});
    cleanup();
  }
}

function rejectCall() { socket.emit('call:reject', {callId: S.call.id}); cleanup(); }
function hangup() { socket.emit('call:end', {callId: S.call.id}); }

function toggleCam() {
  if (!localStream || !S.call) return;
  var tr = localStream.getVideoTracks()[0]; if (!tr) return;
  tr.enabled = !tr.enabled; S.call.camOff = !tr.enabled; render();
}

// front <-> back camera without dropping the call
async function flipCam() {
  if (!localStream || !S.call || !S.call.video || S.call.flipping) return;
  var old = localStream.getVideoTracks()[0]; if (!old) return;
  var face = S.call.face === 'environment' ? 'user' : 'environment';
  S.call.flipping = true;
  old.stop(); // most phones need the first camera released before the second opens
  try {
    var ns = await navigator.mediaDevices.getUserMedia({video: vidConstraints(face)});
    var nt = ns.getVideoTracks()[0];
    var sd = pc && pc.getSenders().filter(function (x) { return x.track && x.track.kind === 'video'; })[0];
    if (sd) await sd.replaceTrack(nt);
    localStream.removeTrack(old); localStream.addTrack(nt);
    nt.enabled = !S.call.camOff;
    var lv = $('lv'); lv.srcObject = localStream; lv.style.transform = face === 'user' ? 'scaleX(-1)' : 'none'; lv.play().catch(function () {});
    S.call.face = face;
  } catch (e) { toast(t('cam')); }
  if (S.call) S.call.flipping = false;
}

async function toggleSpeaker() {
  if (!IS_NATIVE_APP || !S.call || S.call.video || S.call.state !== 'active') return;
  var plugin = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AudioRoute;
  if (!plugin || !plugin.setSpeaker) { toast('Speaker control is unavailable.'); return; }
  var next = !S.call.speakerOn;
  try {
    await plugin.setSpeaker({enabled: next});
    S.call.speakerOn = next;
    render();
  } catch (e) { toast('Could not change audio output.'); }
}

function toggleMute() {
  if (!S.call || !localStream) return;

  var tracks = localStream.getAudioTracks();
  if (!tracks.length) {
    toast(t('mic'));
    return;
  }

  tracks[0].enabled = !tracks[0].enabled;
  S.call.muted = !tracks[0].enabled;

  render();
}

function connect() {
  if (socket) socket.close();
  socket = io(API_BASE, {auth: {token: S.token}, transports: ['websocket', 'polling']});
  socket.on('connect', function () {
    S.online = true;
    // Sync conversations and any messages received while this device was offline.
    loadChats();
    if (S.chat && S.chat.phone) openChat(S.chat.phone);
    render();
  });
  socket.on('disconnect', function () { S.online = false; if (S.call) cleanup(); else render(); });
  socket.on('connect_error', function () { S.online = false; render(); });

  socket.on('presence:update', function (d) {
    if (!d) return;
    S.presence[d.userId] = !!d.online;
    S.chats.forEach(function (c) { if (String(c.id) === String(d.userId)) c.online = !!d.online; });
    if (S.chat && String(S.chat.id) === String(d.userId)) { S.chat.online = !!d.online; S.peerTyping = false; }
    render();
  });
  socket.on('typing:update', function (d) {
    if (!d || !S.chat || String(S.chat.id) !== String(d.userId)) return;
    S.peerTyping = !!d.typing;
    var el = $('peerStatus'); if (el) el.textContent = chatPeerStatus();
  });

  // messages
  socket.on('msg:new', function (m) {
    if (S.chat && S.chat.phone === m.from_phone) {
      S.chat.messages.push(Object.assign({mine: false}, m));
      socket.emit('msg:read', {phone: m.from_phone});
      renderMsgs();
    } else {
      if (S.set.sound) beep(0.15);
      buzz(100);
    }
    if (document.hidden) notify(m.from_name || m.from_phone, m.kind === 'text' ? m.body : preview(m));
    loadChats();
  });
  socket.on('msg:edit', function (d) {
    if (S.chat) { var m=S.chat.messages.find(function(x){return x.id===d.id;}); if(m){m.body=d.body;m.edited_at=d.edited_at;renderMsgs();} }
  });
  socket.on('msg:del', function (d) {
    if (S.chat) { S.chat.messages=S.chat.messages.filter(function(x){return x.id!==d.id;}); renderMsgs(); }
  });
  socket.on('msg:react', function (d) {
    if (S.chat) { var m=S.chat.messages.find(function(x){return x.id===d.id;}); if(m){m.reactions=d.reactions||[];renderMsgs();} }
  });
  socket.on('msg:read', function (d) {
    if (S.chat && S.chat.phone === d.phone) {
      S.chat.messages.forEach(function (m) { if (m.mine && !m.read_at) m.read_at = new Date().toISOString(); });
      renderMsgs();
    }
  });

  // calls
  // group chat
  socket.on('gmsg:new', function (m) {
    if (S.grp && S.grp.id === m.group_id) {
      S.grp.messages.push(Object.assign({mine: false}, m));
      api('/groups/' + m.group_id + '/read', 'POST');
      renderMsgs();
    } else {
      if (S.set.sound) beep(0.15);
      buzz(100);
    }
    if (document.hidden) {
      var gg = S.groups.filter(function (x) { return x.id === m.group_id; })[0];
      notify((gg && gg.name) || 'Ethio Call', (m.from_name || m.from_phone) + ': ' + (m.kind === 'text' ? m.body : preview(m)));
    }
    loadGroups();
  });
  socket.on('gmsg:del', function (d) {
    if (S.grp && S.grp.id === d.group_id) { S.grp.messages = S.grp.messages.filter(function (m) { return m.id !== d.id; }); renderMsgs(); }
  });
  socket.on('gmsg:edit', function (d) {
    if (S.grp && S.grp.id === d.group_id) {
      var m = S.grp.messages.find(function(x){return x.id===d.id;});
      if (m) { m.body = d.body; m.edited_at = d.edited_at; renderMsgs(); }
    }
  });
  socket.on('gmsg:react', function (d) {
    if (S.grp && S.grp.id === d.group_id) {
      var m = S.grp.messages.find(function(x){return x.id===d.id;});
      if (m) { m.reactions = d.reactions || []; renderMsgs(); }
    }
  });
  socket.on('group:new', function (d) { loadGroups(); toast('👥 ' + d.name); });
  socket.on('group:update', function (d) { if (S.grp && S.grp.id === d.id) refreshGroup(); loadGroups(); });
  socket.on('group:gone', function (d) { if (S.grp && S.grp.id === d.id) { S.grp = null; render(); } loadGroups(); });

  socket.on('call:ringing', function (d) { if (S.call) { S.call.id = d.callId; S.call.reach = d.reach; render(); } });

  socket.on('call:incoming', function (d) {
    S.call = {role: 'callee', state: 'incoming', peer: d.from.name ? d.from.name + ' (' + d.from.phone + ')' : d.from.phone, id: d.callId, video: !!d.video};
    addRecent(d.from.phone, 'in');
    ringStart(); render();
    notify(t('incoming'), d.from.name || d.from.phone);
  });

  socket.on('call:accepted', async function () {
    if (!pc || !S.call) return;
    rbStop();
    S.call.state = 'active'; S.call.t0 = Date.now();
    render(); tick();
    var offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    limitBitrate();
    socket.emit('webrtc:offer', {callId: S.call.id, sdp: pc.localDescription});
  });

  socket.on('webrtc:offer', async function (d) {
    if (!pc) return;
    await pc.setRemoteDescription(d.sdp); await flushIce();
    var a = await pc.createAnswer();
    await pc.setLocalDescription(a);
    limitBitrate();
    socket.emit('webrtc:answer', {callId: S.call.id, sdp: pc.localDescription});
  });

  socket.on('webrtc:answer', async function (d) {
    if (!pc) return;
    await pc.setRemoteDescription(d.sdp); await flushIce();
  });

  socket.on('webrtc:ice', async function (d) {
    if (!pc) return;
    if (pc.remoteDescription) { try { await pc.addIceCandidate(d.candidate); } catch (e) {} }
    else pendingIce.push(d.candidate);
  });

  socket.on('call:charged', function (d) { S.coins = d.balance; });
  socket.on('wallet:update', function (d) {
    S.coins = d.coins;
    if (S.set.sound) beep(0.3);
    loadWallet().then(loadReqs).then(loadBonus).then(function () { render(); toast('+' + d.added + ' 🪙', 5000); });
  });
  socket.on('call:low_balance', function () { toast('⚠ ' + t('balance') + ' < 1'); });
  socket.on('call:ended', function (d) {
    var vd = !!(S.call && S.call.video);
    var mb = Math.max(0.1, d.seconds * (vd ? (S.set.saver ? 22 : 55) : (S.set.saver ? 2.5 : 4.5)) / 1000).toFixed(1);
    var m = d.reason + ' · ' + d.seconds + 's · ' + d.coinsCharged + ' 🪙' + (d.seconds > 0 ? ' · ' + t('mbUsed').replace('{n}', mb) : '');
    var caller = S.call && S.call.role === 'caller';
    var key = {no_answer: 'no_answer', rejected: 'rejected', unreachable: 'offline', no_coins: 'no_coins'}[d.reason];
    cleanup();
    if (caller && key) announce(key); else toast(m);
  });
  socket.on('call:error', function (d) {
    cleanup();
    if (d.code) announce(d.code); else toast(d.message);
  });
}

/* ---------- start ---------- */
if (!IS_NATIVE_APP && 'serviceWorker' in navigator) navigator.serviceWorker.register(API_BASE + '/sw.js').catch(function () {});
fetch(API_BASE + '/health').then(function (r) { return r.json(); }).then(function (j) {
  S.meth = {sms: !!j.sms, tg: !!j.tg, tr: !!j.tr};
  if (!S.me && !S.loading) render();
}).catch(function () {});
if (S.token) { S.loading = true; render(); boot(); } else render();
