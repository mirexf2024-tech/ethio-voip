<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Ethio Call Admin</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0 auto;padding:14px;max-width:520px;background:#f3f4f6;color:#111}
h1{font-size:20px;margin:6px 0 12px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
input,select,button{font-size:17px;padding:12px;border-radius:10px;border:1px solid #d1d5db;width:100%;margin:5px 0}
button{background:#0f766e;color:#fff;border:0;font-weight:600}
button.g{background:#16a34a}button.r{background:#dc2626}button.x{background:#e5e7eb;color:#111}
.row{display:flex;gap:8px}.row button{margin:5px 0}
.s{font-size:13px;color:#6b7280}
.req{border-top:1px solid #eee;padding-top:10px;margin-top:10px}
#msg{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;max-width:90%}
</style>
</head>
<body>
<h1>Ethio Call · Admin</h1>

<div class="card">
  <input id="key" type="password" placeholder="Admin key" autocomplete="off">
  <button onclick="saveKey()">Open</button>
  <div class="s">The key is the ADMIN_KEY you set on Render. It stays only in this tab.</div>
</div>

<div class="card">
  <b>Payment requests</b>
  <select id="st" onchange="load()">
    <option value="pending">Waiting</option>
    <option value="approved">Approved</option>
    <option value="rejected">Rejected</option>
  </select>
  <button class="x" onclick="load()">Refresh</button>
  <div id="list"></div>
</div>

<div class="card">
  <b>Add coins by hand</b>
  <input id="cp" type="tel" placeholder="+2519XXXXXXXX">
  <input id="cc" type="number" placeholder="Coins">
  <input id="cn" placeholder="Note (e.g. gift)">
  <button class="g" onclick="credit()">Add coins</button>
</div>

<div id="msg"></div>
<script>
var KEY = sessionStorage.getItem('ak') || '';
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
};
function say(m) { var e = $('msg'); e.textContent = m; e.style.display = 'block'; setTimeout(function () { e.style.display = 'none'; }, 3500); }

async function call(path, method, body) {
  try {
    var r = await fetch(path, {method: method || 'GET',
      headers: {'Content-Type': 'application/json', 'x-admin-key': KEY},
      body: body ? JSON.stringify(body) : undefined});
    return await r.json();
  } catch (e) { return {error: 'Network error'}; }
}

function saveKey() {
  KEY = $('key').value; $('key').value = '';
  sessionStorage.setItem('ak', KEY);
  load();
}

async function load() {
  if (!KEY) return;
  var r = await call('/admin/requests?status=' + $('st').value);
  if (!Array.isArray(r)) { $('list').innerHTML = ''; return say(r.error || 'Error'); }
  $('list').innerHTML = r.map(function (p) {
    return '<div class="req"><b>' + esc(p.package_name) + ' · ' + p.coins + ' coins · ' + p.price_etb + ' ETB</b><br>' +
      '<span class="s">' + esc(p.name || '') + ' ' + esc(p.phone) + '<br>Transaction ID: <b>' + esc(p.ref) + '</b><br>' +
      new Date(p.created_at).toLocaleString() + '</span>' +
      (p.status === 'pending'
        ? '<div class="row"><button class="g" onclick="decide(' + p.id + ',true)">Approve</button>' +
          '<button class="r" onclick="decide(' + p.id + ',false)">Reject</button></div>'
        : '') + '</div>';
  }).join('') || '<div class="s">Nothing here</div>';
}

async function decide(id, ok) {
  if (ok && !confirm('Did the money arrive in your Telebirr? Add the coins?')) return;
  var r = await call('/admin/decide', 'POST', {id: id, approve: ok});
  say(r.ok ? (ok ? 'Coins added' : 'Rejected') : (r.error || 'Error'));
  load();
}

async function credit() {
  var r = await call('/admin/credit', 'POST', {phone: $('cp').value, coins: $('cc').value, note: $('cn').value});
  say(r.ok ? 'Done. New balance: ' + r.coins : (r.error || 'Error'));
}

if (KEY) load();
</script>
</body>
</html>
