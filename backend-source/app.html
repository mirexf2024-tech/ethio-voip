<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111;max-width:480px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#0f766e;color:#fff;font-weight:700}
.pill{background:#ffffff33;border-radius:99px;padding:4px 12px;font-size:14px}
.pg{padding:16px 16px calc(90px + var(--adh,0px))}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
input,select{width:100%;font-size:17px;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0;background:#fff;color:#111}
button{font-size:17px;padding:13px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:600;width:100%;margin:6px 0}

.nav{position:fixed;bottom:var(--adh,0px);left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-top:1px solid #e5e7eb;padding-bottom:env(safe-area-inset-bottom)}
.nav div{flex:1;text-align:center;padding:10px 0;font-size:12px;color:#6b7280;position:relative}
.nav .on{color:#0f766e;font-weight:700}

.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{background:#fff;color:#111;border:1px solid #e5e7eb;font-size:22px;margin:0}
.num{font-size:26px;text-align:center;min-height:40px;letter-spacing:1px;word-break:break-all}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.row:last-child{border:0}
.row button{width:auto;padding:8px 16px;margin:0;flex:none}
.row .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:60vw}
a.btn{display:block;text-align:center;text-decoration:none;font-size:17px;padding:13px;border-radius:10px;background:#229ED9;color:#fff;font-weight:600;margin:6px 0}
.av{width:96px;height:96px;border-radius:50%;background:#99f6e4;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:38px;color:#0f766e;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:44px;height:44px;font-size:18px;margin:0;flex:none}
.big{font-size:38px;font-weight:800;text-align:center}
.s{font-size:13px;color:#6b7280}
.c{text-align:center}
.badge{background:#dc2626;color:#fff;border-radius:99px;padding:2px 8px;font-size:12px;flex:none}
.rt{display:inline-block;background:#d1fae5;color:#065f46;border-radius:6px;padding:0 6px;font-size:11px;margin-left:4px;font-weight:600}
.rt.m{background:#fee2e2;color:#b91c1c}
.ov{position:fixed;inset:0;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;z-index:9}
.ov button{max-width:320px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:90%}
.ban{background:#f59e0b;color:#000;text-align:center;font-size:13px;padding:4px}
.chatv{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#e5ddd5;display:flex;flex-direction:column;z-index:5}
.chatv .top span{cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:10px}
.mr{display:flex;justify-content:flex-start}
.mr.me{justify-content:flex-end}
.b{max-width:82%;padding:8px 10px;border-radius:12px;margin:3px 0;background:#fff;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.mr.me .b{background:#d9fdd3}
.pic{max-width:100%;max-height:260px;border-radius:8px;display:block}
.ph{padding:30px 20px;background:#eee;border-radius:8px;text-align:center;color:#555}
.pl{background:#0f766e;font-size:15px;padding:8px 14px;width:auto;margin:0}
.comp{display:flex;gap:6px;align-items:center;padding:8px;background:#f0f0f0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.comp input{margin:0;flex:1;min-width:0}
.comp button{width:auto;margin:0;padding:11px 14px;flex:none}
.ic{font-size:24px;padding:4px;cursor:pointer}
#vwrap{position:fixed;inset:0;background:#000;z-index:8;visibility:hidden}
#vwrap.on{visibility:visible}
#rv{width:100%;height:100%;object-fit:cover;background:#000}
#lv{position:absolute;right:12px;top:12px;width:96px;height:128px;object-fit:cover;border-radius:12px;background:#222;border:2px solid #fff3;transform:scaleX(-1)}
.ov.vid{background:transparent;justify-content:space-between;padding:48px 24px 32px}
#adbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e5e7eb;z-index:4;visibility:hidden}
body.ad #adbar{visibility:visible}
#adbar iframe{width:100%;border:0;display:block;height:100px}
#adbar .s{font-size:10px;text-align:center;line-height:14px}

/* Telegram-inspired Ethio Call chats list */
.tg-chat-head{background:#fff;padding:18px 16px 12px;border-bottom:1px solid #e8edf2;margin:-16px -16px 0}.tg-chat-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.tg-chat-title h2{font-size:27px;line-height:1.1;margin:2px 0 0;color:#17212b}.tg-kicker{font-size:10px;letter-spacing:2px;font-weight:800;color:#0f766e}.tg-new{width:42px;height:42px;border-radius:50%;margin:0;padding:0;font-size:27px;line-height:1;background:#0f766e;color:#fff}.tg-search{height:42px;border-radius:12px;background:#f1f4f6;display:flex;align-items:center;gap:8px;padding:0 12px;color:#718096;font-size:23px}.tg-search input{border:0!important;background:transparent!important;margin:0!important;padding:7px 0!important;font-size:15px!important;outline:none;box-shadow:none!important}.tg-newbox{display:none;gap:7px;align-items:center;margin:0 0 10px}.tg-newbox.show{display:flex}.tg-newbox input{min-width:0;margin:0}.tg-newbox button{width:auto;white-space:nowrap;margin:0}.tg-chat-list{background:#fff;margin:0 -16px;min-height:48vh;padding:2px 12px 16px}.tg-chat-row{display:flex;align-items:center;gap:12px;padding:12px 5px;border-bottom:1px solid #edf0f2;min-height:74px;cursor:pointer}.tg-avatar-wrap{position:relative;flex:none}.tg-avatar-wrap .av.sm{width:52px;height:52px;font-size:21px}.tg-online{position:absolute;width:12px;height:12px;border:2px solid #fff;border-radius:50%;background:#22c55e;right:0;bottom:0}.tg-chat-copy{flex:1;min-width:0}.tg-chat-line{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}.tg-chat-line b{font-size:15px;color:#17212b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tg-preview{font-size:13px;color:#718096;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:290px}.tg-time{font-size:10px;color:#0f766e;font-weight:700;flex:none}.tg-empty{text-align:center;padding:54px 20px;color:#718096}.tg-empty-icon{font-size:38px;margin-bottom:10px}

/* Ethio Call four-tab navigation */
.ec-menu-btn{border:0;background:transparent;color:inherit;font-size:24px;width:44px;min-height:42px;padding:4px}.ec-menu{position:fixed;z-index:120;right:12px;top:58px;width:min(240px,75vw);background:var(--card,#fff);color:var(--text,#172033);border:1px solid rgba(120,130,150,.25);border-radius:14px;box-shadow:0 12px 35px #0003;padding:8px}.ec-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:13px;border-radius:9px}.ec-menu button:active{background:rgba(30,100,180,.12)}

/* Refined mobile layout: consistent sizing, spacing and touch targets */
html{min-height:100%;-webkit-text-size-adjust:100%}
body{width:100%;overflow-x:hidden;background:#f4f7fb;color:#172033;font-size:15px;line-height:1.45}
.top{min-height:58px;padding:10px 16px;background:linear-gradient(115deg,#003b82,#0759ad);box-shadow:0 3px 12px #003b821c;position:sticky;top:0;z-index:80}

.card{border:1px solid #e8edf5;border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 3px 12px #102b4d0a}
button,input,select{font-family:inherit;max-width:100%}
button{font-size:15px;line-height:1.25;min-height:44px;padding:10px 14px;border-radius:12px;background:#0754a2;margin:5px 0;white-space:normal;overflow-wrap:anywhere}
input,select{font-size:16px;min-height:46px;padding:10px 12px;border-radius:12px;border-color:#d8e0ec;margin:5px 0}
.row{gap:10px;padding:12px 2px;min-width:0}.row>*{min-width:0}.row button{min-height:38px;padding:7px 12px;font-size:14px}
.nav{min-height:62px;padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -5px 18px #142d4a12;border-top:1px solid #e9eef5;background:#fff}
.nav div{font-size:11px;line-height:1.3;padding:5px 1px;min-width:0;overflow-wrap:anywhere}.nav .on{color:#0754a2}

.av{flex:none;border:3px solid #e8f0fb;background:#e7f0fc;color:#0754a2}

.pic{max-width:100%;height:auto;object-fit:cover;border-radius:12px}
.ec-menu{top:62px;border-color:#e2eaf4;background:#fff;box-shadow:0 14px 36px #09274724}
.ec-menu button{min-height:46px;font-size:15px;color:#172033}

html{background:var(--ec-bg)}
body{background:linear-gradient(180deg,#eaf2fc 0,#f5f8fc 230px,#f5f7fb 100%);color:var(--ec-ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.005em}
#app{min-height:100vh}
.top{background:linear-gradient(115deg,#062b59 0%,#0752a0 72%,#0b66b7 100%);color:#fff;padding:15px 17px;min-height:62px;box-shadow:0 5px 18px #082b552b;position:sticky;top:0;z-index:30}
.top:after{content:"";position:absolute;left:16px;bottom:0;width:42px;height:3px;border-radius:4px;background:var(--ec-gold)}
.pg{padding:17px 15px calc(104px + var(--adh,0px))}
.card{background:rgba(255,255,255,.97);border:1px solid #e8eef6;border-radius:19px;padding:16px;margin-bottom:13px;box-shadow:0 7px 22px #183b6410}

input:focus,select:focus,textarea:focus{border-color:#4388cf;box-shadow:0 0 0 3px #0b5db51a}
button{border-radius:13px;background:linear-gradient(135deg,#0753a1,#0a69bf);color:#fff;font-weight:700;min-height:46px;padding:12px 15px;box-shadow:0 4px 10px #0753a11c;transition:transform .12s,filter .12s}
button:active{transform:scale(.985);filter:brightness(.96)}
button.g{background:linear-gradient(135deg,#16845b,#20a875)}button.r{background:linear-gradient(135deg,#c83e4b,#e0525d)}button.x{background:#edf3fa;color:#24415f;box-shadow:none;border:1px solid #dfe8f2}
.nav{background:rgba(255,255,255,.97);border-top:1px solid #e4ebf4;box-shadow:0 -7px 24px #15385a12;backdrop-filter:blur(14px);padding-top:6px;z-index:40}
.nav div{padding:9px 2px 8px;color:#8190a3;font-weight:600}

.pill{background:#ffffff25;border:1px solid #ffffff35;border-radius:30px;padding:5px 11px}
.ec-menu{border-radius:17px!important;overflow:hidden}
.ec-menu button{box-shadow:none;border-radius:10px;margin:3px 0}
.av{border:2px solid #dceafa;background:#eaf3ff;color:#0754a2}
@media(min-width:481px){body{border-left:1px solid #e8eef6;border-right:1px solid #e8eef6;box-shadow:0 0 42px #12345a12}}

  o.start(); o.stop(actx.currentTime + (len || 0.4));
}
function buzz(ms) { if (S.set.vibrate && navigator.vibrate) navigator.vibrate(ms); }
function ringStart() {
  ringStop();
  if (S.set.sound) beep();
  ringT = setInterval(function () { if (S.set.sound) beep(); buzz(300); }, 1500);
}
function ringStop() { clearInterval(ringT); ringT = null; }

// ringback: what the CALLER hears while the other phone rings.
// Put your own ringback.mp3 in the repo to replace this standard tone (1 s tone, 4 s silence).
var rbT = null, rbOsc = null, rbAudio = null;
function rbSynth() {
  if (!actx) return;
  var once = function () {
    var o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 425; g.gain.value = 0.12;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 1);
    rbOsc = o;
  };
  once(); rbT = setInterval(once, 5000);
}
function rbStart() {
  rbStop();
  if (!S.set.sound) return;
  var a = new Audio('/sounds/ringback.mp3');
  a.loop = true; rbAudio = a;
  var fallback = function () { if (rbAudio === a) { rbAudio = null; rbSynth(); } };
  a.onerror = fallback;
  a.play().catch(fallback);
}
function rbStop() {
  if (rbAudio) { rbAudio.pause(); rbAudio = null; }
  clearInterval(rbT); rbT = null;
  if (rbOsc) { try { rbOsc.stop(); } catch (e) {} rbOsc = null; }
}

// status announcements (like the network voice): plays /sounds/<key>-<lang>.mp3 if you uploaded it,
// otherwise the phone's own voice (only if it has one for this language), and always shows the text
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  var lang = {om: 'om', am: 'am', en: 'en'}[S.lang];
  var v = (speechSynthesis.getVoices() || []).filter(function (x) {
    return x.lang && x.lang.toLowerCase().indexOf(lang) === 0;
  })[0];
  if (!v) return;
  var u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang;
  speechSynthesis.speak(u);
}
function announce(key) {
  var text = t('ann_' + key);
  toast(text, 7000);
  var exts = ['mp3', 'm4a', 'ogg', 'wav'], i = 0;
  (function next() {
    if (i >= exts.length) return speak(text);
    var a = new Audio('/sounds/' + key + '-' + S.lang + '.' + exts[i++]);
    var moved = false;
    var fail = function () { if (!moved) { moved = true; next(); } };
    a.onerror = fail;
    a.play().catch(fail);
  })();
}
function notify(title, body) {
  if (!document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
  navigator.serviceWorker.ready.then(function (r) {
    r.showNotification(title, {body: body, icon: '/icon-192.png', tag: 'ethio'});
  }).catch(function () { try { new Notification(title, {body: body}); } catch (e) {} });
}
function b64ToU8(b64) {
  var pad = '='.repeat((4 - b64.length % 4) % 4);
  var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
function pushReady() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function swReady() {
  return Promise.race([navigator.serviceWorker.ready, new Promise(function (_, rej) { setTimeout(rej, 5000); })]);
}
// subscribe this phone to push (only if the user already allowed notifications)
async function pushOn() {
  if (!pushReady() || Notification.permission !== 'granted') return false;
  try {
    var reg = await swReady();
    var sub = await reg.pushManager.getSubscription();
    if (!sub) {
      var k = await (await fetch('/push/key')).json();
      if (!k.key) return false;
      sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64ToU8(k.key)});
    }
    var r = await api('/push/subscribe', 'POST', {subscription: sub.toJSON()});
    return !!r.ok;
  } catch (e) { return false; }
}
// forget this phone (used when logging out, so the next person does not get your calls)
async function pushOff() {
  if (!pushReady()) return;
  try {
    var reg = await swReady();
    var sub = await reg.pushManager.getSubscription();
    if (sub) { await api('/push/unsubscribe', 'POST', {endpoint: sub.endpoint}); await sub.unsubscribe(); }
  } catch (e) {}
}
async function askNotif() {
  if (!pushReady()) return toast('Not supported');
  var p = await Notification.requestPermission();
  if (p !== 'granted') { toast(t('off')); return render(); }
  var ok = await pushOn();
  toast(ok ? t('on') : t('notifFail'));
}
async function testPush() {
  var r = await api('/push/test', 'POST');
  toast(r.sent ? t('on') : t('notifFail'));
}

function fmtDur(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function bubble(m, g) {
  var mk = (g ? 'g' : '') + m.id;               // key of the photo/voice/file in the cache
  var k = g ? "'g" + m.id + "'" : String(m.id); // the same key written as JavaScript text
  var inner = '';
  if (m.kind === 'text') inner = esc(m.body) + (m.tr ? `<div class="s" style="margin-top:4px;border-top:1px dashed #ccc;padding-top:4px">🌐 ${esc(m.tr)}</div>` : (S.meth.tr ? `<div><a href="#" class="s" onclick="trMsg(${m.id},${g ? 1 : 0});return false">🌐 ${t('translate')}</a></div>` : ''));
  else if (m.kind === 'image') {
    inner = M[mk] ? `<img class="pic" src="${M[mk]}" onclick="window.open(M[${k}])">`
      : S.set.saver ? `<div class="ph" onclick="loadImg(${k})">📷 ${t('tapLoad')}</div>`
      : `<img class="pic" data-mid="${mk}">`;
  } else if (m.kind === 'voice') inner = `<button class="pl" onclick="playV(${k})">▶ 🎤 ${fmtDur(m.duration)}</button>`;
  else inner = `<a href="#" onclick="dl(${k},'${safeName(m.media_name)}');return false">📎 ${esc(m.media_name || t('fileWord'))}</a>`;
  var who = g && !m.mine ? `<div class="s" style="font-weight:700;color:#0f766e">${esc(m.from_name || m.from_phone || '')}</div>` : '';
  var tm = new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  var tick = !g && m.mine ? (m.read_at ? ' ✓✓' : ' ✓') : '';
  var del = g && canDelGMsg(m) ? `<a href="#" onclick="delGMsg(${m.id});return false" style="text-decoration:none">🗑</a> ` : '';
  return `<div class="mr ${m.mine ? 'me' : ''}"><div class="b">${who}${inner}<div class="s" style="text-align:right">${del}${tm}${tick}</div></div></div>`;
}

async function sendCode() {
  var p = $('ph').value;
  var r = await api('/auth/request-otp', 'POST', {phone: p});
  if (r.ok) { S.otpSent = true; S.d_ph = p; S.devCode = r.devCode || ''; S.tgLink = ''; render(); if (r.sms) startWebOtp(); }
  else toast(r.error || 'Error');
}

async function tgCode() {
  var p = $('ph').value;
  var r = await api('/auth/tg/start', 'POST', {phone: p});
  if (!r.ok) return toast(r.error || 'Error');
  S.otpSent = true; S.d_ph = p; S.devCode = ''; S.tgLink = r.link; render();
}

// Chrome on Android can read the code from the SMS by itself (asks you once)
function startWebOtp() {
  if (!('OTPCredential' in window)) return;
  try {
    var ac = new AbortController();
    setTimeout(function () { ac.abort(); }, 120000);
    navigator.credentials.get({otp: {transport: ['sms']}, signal: ac.signal}).then(function (o) {
      if (o && o.code) { S.d_cd = o.code; render(); doLogin(); }
    }).catch(function () {});
  } catch (e) {}
}

async function doLogin() {
  var r = await api('/auth/verify-otp', 'POST', {phone: S.d_ph, code: $('cd').value, ref: localStorage.getItem('ref') || undefined});
  if (!r.token) return toast(r.error || 'Error');
  S.token = r.token; localStorage.setItem('tk', r.token); localStorage.removeItem('ref');
  S.loading = true; render();
  boot();
}

async function logout() {
  await pushOff();
  localStorage.removeItem('tk');
  if (socket) socket.close();
  S.token = null; S.me = null; S.otpSent = false; S.loading = false; S.online = false;
  S.chat = null; S.chats = []; S.blocks = []; S.call = null;
  S.grp = null; S.groups = []; S.ads = null; adShown = ''; try { $('adf').srcdoc = ''; } catch (e) {}
  render();
}

async function delAcc() {
  if (!confirm(t('delq')) || !confirm(t('delq2'))) return;
  var r = await api('/account', 'DELETE');
  if (r.ok) { localStorage.clear(); logout(); } else toast(r.error || 'Error');

  S.payPkg = null; S.d_rf = '';
  await loadReqs(); render();

function pickPhoto(inp) {
  var f = inp.files[0]; if (!f) return;
  var img = new Image();
  img.onload = function () {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var s = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
    S.photo = c.toDataURL('image/jpeg', 0.7);
    render();
  };
  img.src = URL.createObjectURL(f);
}

async function saveProfile() {
  var r = await api('/profile', 'PUT', {name: $('nm').value, about: $('ab').value, avatar_url: S.photo || S.me.avatar_url || null});
  if (!r.id) return toast(r.error || 'Error');
  S.me = r; S.photo = null; S.d_nm = null; S.d_ab = null;
  toast(t('saved'));
}

async function boot() {
  var me = await api('/me');
  if (!me || !me.id) { S.loading = false; return me && me.error === 'Network error' ? (S.msg = me.error, render()) : logout(); }
  S.me = me;
  await Promise.all([loadWallet(), loadBlocks(),
    api('/chats').then(function (c) { if (Array.isArray(c)) S.chats = c; }),
    api('/packages').then(function (p) { if (Array.isArray(p)) S.pkgs = p; }),
    api('/pay-info').then(function (i) { if (i && i.method) S.payInfo = i; }),
    loadReqs(), loadBonus(), loadAds(),
    api('/groups').then(function (g) { if (Array.isArray(g)) S.groups = g; }),
    api('/ice').then(function (i) { if (i.iceServers) iceServers = i.iceServers; })]);
  S.loading = false;
  connect();
  render();
  pushOn();
  joinPending();
}

/* ---------- messages ---------- */
async function getMedia(id) {
  if (M[id]) return M[id];
  var sid = String(id);
  var r = await fetch((sid.charAt(0) === 'g' ? '/groups/media/' + sid.slice(1) : '/messages/media/' + sid), {headers: {Authorization: 'Bearer ' + S.token}});
  if (!r.ok) throw new Error('media');
  M[id] = URL.createObjectURL(await r.blob());
  return M[id];
}
async function trMsg(id, g) {
  var cur = g ? S.grp : S.chat;
  var m = cur && cur.messages.filter(function (x) { return x.id === id; })[0];
  if (!m || m.kind !== 'text') return;
  var r = await api('/translate', 'POST', {text: m.body, to: S.lang});
  if (!r.ok) return toast(r.error || t('trFail'));
  if (r.same) return toast(t('trSame'));
  m.tr = r.text; renderMsgs();
}
async function loadImg(id) { try { await getMedia(id); renderMsgs(); } catch (e) { toast('Error'); } }
async function playV(id) {
  try {
    var u = await getMedia(id);
    if (curAudio) {
      curAudio.pause();
      curAudio.removeAttribute('src');
      curAudio.load();
    }
    curAudio = new Audio();

function toDataURL(b) {
  return new Promise(function (res, rej) {
    var f = new FileReader(); f.onload = function () { res(f.result); }; f.onerror = rej; f.readAsDataURL(b);
  });
}

function compressImage(f) {
  return new Promise(function (res, rej) {
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, 1280 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { b ? res(b) : rej(new Error('img')); }, 'image/jpeg', 0.7);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = rej; img.src = URL.createObjectURL(f);
  });
}

    if (blob.size > 1000000) return toast(t('tooBig'));
    toast(t('sending'));
    await postMsg({kind: k, data: await toDataURL(blob), name: f.name, size: blob.size}, blob);

}

async function voiceStart() {
  if (S.call) return toast(t('mic'));
  try { VR.stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch (e) { return toast(t('mic')); }
  var mt = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(function (m) {
    return window.MediaRecorder && MediaRecorder.isTypeSupported(m);
  });
  var opts = {audioBitsPerSecond: 24000}; if (mt) opts.mimeType = mt;
  VR.mr = new MediaRecorder(VR.stream, opts);
  VR.chunks = []; VR.cancel = false;
  VR.mr.ondataavailable = function (e) { if (e.data && e.data.size) VR.chunks.push(e.data); };
  VR.mr.onstop = async function () {
    VR.stream.getTracks().forEach(function (tr) { tr.stop(); });
    clearInterval(VR.timer); S.recording = false;
    var secs = (Date.now() - VR.t0) / 1000;
    render();
    if (VR.cancel || !VR.chunks.length || !(S.chat || S.grp)) return;
    var blob = new Blob(VR.chunks, {type: VR.mr.mimeType || 'audio/webm'});
    if (blob.size > 1000000) return toast(t('tooBig'));
    await postMsg({kind: 'voice', data: await toDataURL(blob), size: blob.size, duration: Math.round(secs)}, blob);
  };
  VR.mr.start(); VR.t0 = Date.now(); S.recording = true; render();
  VR.timer = setInterval(function () {
    var e = $('rt'), ms = Date.now() - VR.t0;
    if (e) e.textContent = fmtDur(ms / 1000);
    if (ms > 120000) voiceStop(false);
  }, 500);
}

/* ---------- calling ---------- */
function key(k) {
  if (k === '⌫') S.dial = S.dial.slice(0, -1);
  else if (S.dial.length < 16) S.dial += k;
  render();
}

function vidConstraints(face) {
  return {facingMode: face ? {ideal: face} : 'user', width: {ideal: S.set.saver ? 320 : 640}, height: {ideal: S.set.saver ? 240 : 480}, frameRate: {ideal: S.set.saver ? 15 : 24, max: 24}};
}

async function media(video) {
  localStream = await navigator.mediaDevices.getUserMedia({
    audio: {echoCancellation: true, noiseSuppression: true},
    video: video ? vidConstraints() : false
  });
  if (video) {
    var lv = $('lv'); lv.style.transform = ''; lv.srcObject = localStream; lv.play().catch(function () {});
  }
}

function mkPeer() {
  pc = new RTCPeerConnection({iceServers: iceServers});
  localStream.getTracks().forEach(function (tr) { pc.addTrack(tr, localStream); });
  pc.ontrack = function (e) {
    $('remote').srcObject = e.streams[0]; $('remote').play().catch(function () {});
    var rv = $('rv'); if (rv && S.call && S.call.video) { rv.srcObject = e.streams[0]; rv.play().catch(function () {}); }
  };
  pc.oniceconnectionstatechange = function () {
    if (S.call && pc) { S.call.ice = pc.iceConnectionState; render(); }
  };
  pc.onicecandidate = function (e) {
    if (e.candidate && S.call) socket.emit('webrtc:ice', {callId: S.call.id, candidate: e.candidate});
  };
}

async function flushIce() {
  for (var i = 0; i < pendingIce.length; i++) { try { await pc.addIceCandidate(pendingIce[i]); } catch (e) {} }
  pendingIce = [];
}

// low-data mode: ~16 kbps voice (about 0.12 MB per minute); otherwise 32 kbps
function limitBitrate() {
  try {
    pc.getSenders().forEach(function (sd) {
      if (!sd.track) return;
      var p = sd.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      if (sd.track.kind === 'audio') p.encodings[0].maxBitrate = S.set.saver ? 16000 : 32000;
      else if (sd.track.kind === 'video') { p.encodings[0].maxBitrate = S.set.saver ? 150000 : 400000; p.encodings[0].maxFramerate = S.set.saver ? 15 : 24; }
      else return;
      sd.setParameters(p).catch(function () {});
    });
  } catch (e) {}
}

function tick() {
  clearInterval(tickT);
  tickT = setInterval(function () {
    var e = $('clk');
    if (e && S.call && S.call.state === 'active') e.textContent = clock();
  }, 500);
}

function cleanup() {
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(function (tr) { tr.stop(); }); localStream = null; }
  $('remote').srcObject = null; $('rv').srcObject = null; $('lv').srcObject = null;
  clearInterval(tickT); ringStop(); rbStop();
  S.call = null; pendingIce = [];
  render();
  loadWallet().then(render);
}

async function startCall(video) {
  if (!S.dial) return;
  video = video === true;
  unlock();
  if (!S.online) return toast(t('offline'));
  try {
    await media(video); mkPeer();
    S.call = {state: 'ringing', peer: S.dial, id: null, role: 'caller', video: video};
    addRecent(S.dial, 'out');
    socket.emit('call:start', {toPhone: S.dial, video: video});
    rbStart();
    render();
  } catch (e) { toast(t(video ? 'cam' : 'mic')); cleanup(); }
}

async function acceptCall() {
  ringStop();
  try {
    await media(!!S.call.video); mkPeer();
    socket.emit('call:accept', {callId: S.call.id});
    S.call.state = 'active'; S.call.t0 = Date.now();
    render(); tick();
  } catch (e) {
    toast(t(S.call && S.call.video ? 'cam' : 'mic'));
    socket.emit('call:reject', {callId: S.call.id});
    cleanup();
  }
}

function rejectCall() { socket.emit('call:reject', {callId: S.call.id}); cleanup(); }
function hangup() { socket.emit('call:end', {callId: S.call.id}); }

function toggleCam() {
  if (!localStream || !S.call) return;
  var tr = localStream.getVideoTracks()[0]; if (!tr) return;
  tr.enabled = !tr.enabled; S.call.camOff = !tr.enabled; render();
}

// front <-> back camera without dropping the call
async function flipCam() {
  if (!localStream || !S.call || !S.call.video || S.call.flipping) return;
  var old = localStream.getVideoTracks()[0]; if (!old) return;
  var face = S.call.face === 'environment' ? 'user' : 'environment';
  S.call.flipping = true;
  old.stop(); // most phones need the first camera released before the second opens
  try {
    var ns = await navigator.mediaDevices.getUserMedia({video: vidConstraints(face)});
    var nt = ns.getVideoTracks()[0];
    var sd = pc && pc.getSenders().filter(function (x) { return x.track && x.track.kind === 'video'; })[0];
    if (sd) await sd.replaceTrack(nt);
    localStream.removeTrack(old); localStream.addTrack(nt);
    nt.enabled = !S.call.camOff;
    var lv = $('lv'); lv.srcObject = localStream; lv.style.transform = face === 'user' ? 'scaleX(-1)' : 'none'; lv.play().catch(function () {});
    S.call.face = face;
  } catch (e) { toast(t('cam')); }
  if (S.call) S.call.flipping = false;
}

function toggleMute() {
  if (!localStream) return;
  var tr = localStream.getAudioTracks()[0];
  tr.enabled = !tr.enabled;
  S.call.muted = !tr.enabled;
  render();
}

function connect() {
  if (socket) socket.close();
  socket = io({auth: {token: S.token}});
  socket.on('connect', function () { S.online = true; render(); });
  socket.on('disconnect', function () { S.online = false; if (S.call) cleanup(); else render(); });
  socket.on('connect_error', function () { S.online = false; render(); });

  // messages
  socket.on('msg:new', function (m) {
    if (S.chat && S.chat.phone === m.from_phone) {
      S.chat.messages.push(Object.assign({mine: false}, m));
      socket.emit('msg:read', {phone: m.from_phone});
      renderMsgs();
    } else {
      if (S.set.sound) beep(0.15);
      buzz(100);
    }
    if (document.hidden) notify(m.from_name || m.from_phone, m.kind === 'text' ? m.body : preview(m));
    loadChats();
  });
  socket.on('msg:read', function (d) {
    if (S.chat && S.chat.phone === d.phone) {
      S.chat.messages.forEach(function (m) { if (m.mine && !m.read_at) m.read_at = new Date().toISOString(); });
      renderMsgs();
    }
  });

  // calls
  // group chat
  socket.on('gmsg:new', function (m) {
    if (S.grp && S.grp.id === m.group_id) {
      S.grp.messages.push(Object.assign({mine: false}, m));
      api('/groups/' + m.group_id + '/read', 'POST');
      renderMsgs();
    } else {
      if (S.set.sound) beep(0.15);
      buzz(100);
    }
    if (document.hidden) {
      var gg = S.groups.filter(function (x) { return x.id === m.group_id; })[0];
      notify((gg && gg.name) || 'Ethio Call', (m.from_name || m.from_phone) + ': ' + (m.kind === 'text' ? m.body : preview(m)));
    }
    loadGroups();
  });
  socket.on('gmsg:del', function (d) {
    if (S.grp && S.grp.id === d.group_id) { S.grp.messages = S.grp.messages.filter(function (m) { return m.id !== d.id; }); renderMsgs(); }
  });
  socket.on('group:new', function (d) { loadGroups(); toast('👥 ' + d.name); });
  socket.on('group:update', function (d) { if (S.grp && S.grp.id === d.id) refreshGroup(); loadGroups(); });
  socket.on('group:gone', function (d) { if (S.grp && S.grp.id === d.id) { S.grp = null; render(); } loadGroups(); });

  socket.on('call:ringing', function (d) { if (S.call) { S.call.id = d.callId; S.call.reach = d.reach; render(); } });

  socket.on('call:incoming', function (d) {
    S.call = {role: 'callee', state: 'incoming', peer: d.from.name ? d.from.name + ' (' + d.from.phone + ')' : d.from.phone, id: d.callId, video: !!d.video};
    addRecent(d.from.phone, 'in');
    ringStart(); render();
    notify(t('incoming'), d.from.name || d.from.phone);
  });

  socket.on('call:accepted', async function () {
    if (!pc || !S.call) return;
    rbStop();
    S.call.state = 'active'; S.call.t0 = Date.now();
    render(); tick();
    var offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    limitBitrate();
    socket.emit('webrtc:offer', {callId: S.call.id, sdp: pc.localDescription});
  });

  socket.on('webrtc:offer', async function (d) {
    if (!pc) return;
    await pc.setRemoteDescription(d.sdp); await flushIce();
    var a = await pc.createAnswer();
    await pc.setLocalDescription(a);
    limitBitrate();
    socket.emit('webrtc:answer', {callId: S.call.id, sdp: pc.localDescription});
  });

  socket.on('webrtc:answer', async function (d) {
    if (!pc) return;
    await pc.setRemoteDescription(d.sdp); await flushIce();
  });

  socket.on('webrtc:ice', async function (d) {
    if (!pc) return;
    if (pc.remoteDescription) { try { await pc.addIceCandidate(d.candidate); } catch (e) {} }
    else pendingIce.push(d.candidate);
  });

  socket.on('call:charged', function (d) { S.coins = d.balance; });
  socket.on('wallet:update', function (d) {
    S.coins = d.coins;
    if (S.set.sound) beep(0.3);
    loadWallet().then(loadReqs).then(loadBonus).then(function () { render(); toast('+' + d.added + ' 🪙', 5000); });
  });
  socket.on('call:low_balance', function () { toast('⚠ ' + t('balance') + ' < 1'); });
  socket.on('call:ended', function (d) {
    var vd = !!(S.call && S.call.video);
    var mb = Math.max(0.1, d.seconds * (vd ? (S.set.saver ? 22 : 55) : (S.set.saver ? 2.5 : 4.5)) / 1000).toFixed(1);
    var m = d.reason + ' · ' + d.seconds + 's · ' + d.coinsCharged + ' 🪙' + (d.seconds > 0 ? ' · ' + t('mbUsed').replace('{n}', mb) : '');
    var caller = S.call && S.call.role === 'caller';
    var key = {no_answer: 'no_answer', rejected: 'rejected', unreachable: 'offline', no_coins: 'no_coins'}[d.reason];
    cleanup();
    if (caller && key) announce(key); else toast(m);
  });
  socket.on('call:error', function (d) {
    cleanup();
    if (d.code) announce(d.code); else toast(d.message);
  });
}

/* ---------- app back navigation ---------- */
try {
  history.pushState({ethioCall:true}, '', location.href);
  window.addEventListener('popstate', function () {
    if (handleAppBack()) history.pushState({ethioCall:true}, '', location.href);
  });
  var appBackPlugin = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (appBackPlugin && appBackPlugin.addListener) {
    appBackPlugin.addListener('backButton', function () {
      if (!handleAppBack() && appBackPlugin.exitApp) appBackPlugin.exitApp();
    });
  }
} catch (backError) {}
/* ---------- start ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
fetch('/health').then(function (r) { return r.json(); }).then(function (j) {
  S.meth = {sms: !!j.sms, tg: !!j.tg, tr: !!j.tr};
  if (!S.me && !S.loading) render();
}).catch(function () {});
if (S.token) { S.loading = true; render(); boot(); } else render();
