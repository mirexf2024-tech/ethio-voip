<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Ethio Call</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111;max-width:480px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#0f766e;color:#fff;font-weight:700}
.pill{background:#ffffff33;border-radius:99px;padding:4px 12px;font-size:14px}
.pg{padding:16px 16px 90px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
input,select{width:100%;font-size:17px;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0;background:#fff;color:#111}
button{font-size:17px;padding:13px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:600;width:100%;margin:6px 0}
button.g{background:#16a34a}button.r{background:#dc2626}button.x{background:#e5e7eb;color:#111}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-top:1px solid #e5e7eb;padding-bottom:env(safe-area-inset-bottom)}
.nav div{flex:1;text-align:center;padding:10px 0;font-size:13px;color:#6b7280}
.nav .on{color:#0f766e;font-weight:700}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{background:#fff;color:#111;border:1px solid #e5e7eb;font-size:22px;margin:0}
.num{font-size:26px;text-align:center;min-height:40px;letter-spacing:1px;word-break:break-all}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.row:last-child{border:0}
.row button{width:auto;padding:8px 16px;margin:0}
.av{width:96px;height:96px;border-radius:50%;background:#99f6e4;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:38px;color:#0f766e;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.big{font-size:38px;font-weight:800;text-align:center}
.s{font-size:13px;color:#6b7280}
.c{text-align:center}
.ov{position:fixed;inset:0;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;z-index:9}
.ov button{max-width:320px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:90%}
.ban{background:#f59e0b;color:#000;text-align:center;font-size:13px;padding:4px}
</style>
</head>
<body>
<div id="app"></div>
<audio id="remote" autoplay playsinline></audio>
<script src="/socket.io/socket.io.js"></script>
<script>
var T = {
  en: {phone:`Phone number`,getCode:`Get code`,code:`Code`,login:`Login`,calls:`Calls`,wallet:`Wallet`,profile:`Profile`,call:`Call`,recent:`Recent`,balance:`Your coins`,packages:`Packages`,buy:`Buy`,history:`History`,name:`Name`,save:`Save`,logout:`Log out`,photo:`Change photo`,rate:`1 coin per minute`,incoming:`Incoming call`,calling:`Calling...`,connected:`Connected`,mute:`Mute`,unmute:`Unmute`,end:`End`,accept:`Accept`,reject:`Reject`,testBuy:`(free test)`,offline:`Connecting to server...`,saved:`Saved`,mic:`Please allow the microphone`},
  om: {phone:`Lakkoofsa bilbilaa`,getCode:`Koodii fudhadhu`,code:`Koodii`,login:`Seeni`,calls:`Bilbila`,wallet:`Korkoroo`,profile:`Profaayilii`,call:`Bilbili`,recent:`Dhiyeenya`,balance:`Koyinii kee`,packages:`Paakeejii`,buy:`Bitadhu`,history:`Seenaa`,name:`Maqaa`,save:`Olkaa'i`,logout:`Ba'i`,photo:`Suuraa jijjiiri`,rate:`Daqiiqaa tokkoof koyinii 1`,incoming:`Bilbilli dhufaa jira`,calling:`Bilbilaa jira...`,connected:`Wal qabateera`,mute:`Cufi`,unmute:`Banii`,end:`Xumuri`,accept:`Fudhadhu`,reject:`Dhiisi`,testBuy:`(yaalii bilisaa)`,offline:`Sarvaratti hidhamaa jira...`,saved:`Olkaa'ameera`,mic:`Maayikiroofonii eeyyami`},
  am: {phone:`ስልክ ቁጥር`,getCode:`ኮድ ላክ`,code:`ኮድ`,login:`ግባ`,calls:`ጥሪ`,wallet:`ቦርሳ`,profile:`መገለጫ`,call:`ደውል`,recent:`የቅርብ ጊዜ`,balance:`ሳንቲሞችህ`,packages:`ጥቅሎች`,buy:`ግዛ`,history:`ታሪክ`,name:`ስም`,save:`አስቀምጥ`,logout:`ውጣ`,photo:`ፎቶ ቀይር`,rate:`በደቂቃ 1 ሳንቲም`,incoming:`ገቢ ጥሪ`,calling:`በመደወል ላይ...`,connected:`ተገናኝቷል`,mute:`ድምጽ አጥፋ`,unmute:`ድምጽ አብራ`,end:`ጨርስ`,accept:`ተቀበል`,reject:`ውድቅ አድርግ`,testBuy:`(ነፃ ሙከራ)`,offline:`ከአገልጋይ ጋር በመገናኘት ላይ...`,saved:`ተቀምጧል`,mic:`ማይክሮፎን ይፍቀዱ`}
};
var S = {lang: localStorage.getItem('lg') || 'om', token: localStorage.getItem('tk'), me: null, coins: 0, hist: [], pkgs: [],
  tab: 'calls', dial: '', call: null, online: false, msg: '', loading: false, otpSent: false, devCode: '', photo: null};
var socket = null, pc = null, localStream = null, pendingIce = [], iceServers = [{urls: 'stun:stun.l.google.com:19302'}];
var tickT = null, ringT = null, actx = null;

var $ = function (id) { return document.getElementById(id); };
var t = function (k) { return (T[S.lang] && T[S.lang][k]) || T.en[k] || k; };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
};

async function api(p, m, b) {
  try {
    var h = {'Content-Type': 'application/json'};
    if (S.token) h.Authorization = 'Bearer ' + S.token;
    var r = await fetch(p, {method: m || 'GET', headers: h, body: b ? JSON.stringify(b) : undefined});
    return await r.json();
  } catch (e) { return {error: 'Network error'}; }
}

function toast(m) {
  S.msg = m; render();
  setTimeout(function () { if (S.msg === m) { S.msg = ''; render(); } }, 3500);
}
function go(tab) { S.tab = tab; render(); }
function setLang(l) { S.lang = l; localStorage.setItem('lg', l); render(); }

/* ---------- ringtone (free, made in the browser) ---------- */
function unlock() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
document.addEventListener('click', unlock);
function beep() {
  if (!actx) return;
  var o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = 440; g.gain.value = 0.15;
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + 0.4);
}
function ringStart() {
  ringStop(); beep();
  ringT = setInterval(function () { beep(); if (navigator.vibrate) navigator.vibrate(300); }, 1500);
}
function ringStop() { clearInterval(ringT); ringT = null; }

/* ---------- recent calls (saved on the phone) ---------- */
function getRec() { try { return JSON.parse(localStorage.getItem('rec') || '[]'); } catch (e) { return []; } }
function addRecent(phone, dir) {
  var r = getRec().filter(function (x) { return x.phone !== phone; });
  r.unshift({phone: phone, dir: dir, ts: Date.now()});
  try { localStorage.setItem('rec', JSON.stringify(r.slice(0, 15))); } catch (e) {}
}

/* ---------- screens ---------- */
function langSel() {
  var o = function (v, n) { return '<option value="' + v + '"' + (S.lang === v ? ' selected' : '') + '>' + n + '</option>'; };
  return '<select onchange="setLang(this.value)">' + o('om', 'Afaan Oromoo') + o('am', 'አማርኛ') + o('en', 'English') + '</select>';
}

function loginView() {
  return `<div class="top">Ethio Call</div><div class="pg"><div class="card">${langSel()}
  <input id="ph" type="tel" placeholder="${t('phone')}" value="${esc(S.d_ph || '+251')}">
  <button onclick="sendCode()">${t('getCode')}</button>
  ${S.otpSent ? `<input id="cd" type="tel" placeholder="${t('code')}" value="${esc(S.d_cd != null ? S.d_cd : S.devCode)}">
  <button class="g" onclick="doLogin()">${t('login')}</button>` : ''}
  </div></div>`;
}

function callsTab() {
  var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '+', '0', '⌫'];
  var rec = getRec();
  return `<div class="card"><div class="num">${esc(S.dial) || '&nbsp;'}</div>
  <div class="keys">${keys.map(function (k) { return `<button onclick="key('${k}')">${k}</button>`; }).join('')}</div>
  <button class="g" onclick="startCall()">📞 ${t('call')}</button>
  <div class="s c">${t('rate')}</div></div>
  <div class="card"><b>${t('recent')}</b>${rec.map(function (r) {
    return `<div class="row" onclick="S.dial='${esc(r.phone)}';render()"><span>${r.dir === 'in' ? '↙' : '↗'} ${esc(r.phone)}</span><span class="s">${new Date(r.ts).toLocaleDateString()}</span></div>`;
  }).join('') || '<div class="s">—</div>'}</div>`;
}

function walletTab() {
  return `<div class="card"><div class="s c">${t('balance')}</div><div class="big">🪙 ${S.coins}</div><div class="s c">${t('rate')}</div></div>
  <div class="card"><b>${t('packages')}</b> <span class="s">${t('testBuy')}</span>${S.pkgs.map(function (p) {
    return `<div class="row"><span><b>${esc(p.name)}</b><br><span class="s">${p.coins} 🪙 · ${p.price_etb} ETB</span></span><button onclick="buy(${p.id})">${t('buy')}</button></div>`;
  }).join('')}</div>
  <div class="card"><b>${t('history')}</b>${S.hist.map(function (h) {
    return `<div class="row"><span class="s">${esc(h.reason || '')}<br>${new Date(h.created_at).toLocaleString()}</span><b style="color:${h.amount > 0 ? '#16a34a' : '#dc2626'}">${h.amount > 0 ? '+' : ''}${h.amount}</b></div>`;
  }).join('') || '<div class="s">—</div>'}</div>`;
}

function profileTab() {
  var m = S.me, ph = S.photo || m.avatar_url, nm = S.d_nm != null ? S.d_nm : (m.name || '');
  return `<div class="card"><div class="av">${ph ? `<img src="${esc(ph)}">` : esc(nm ? nm[0].toUpperCase() : '👤')}</div>
  <label class="s c" style="display:block"><input type="file" accept="image/*" style="display:none" onchange="pickPhoto(this)"><u>📷 ${t('photo')}</u></label>
  <input id="nm" placeholder="${t('name')}" value="${esc(nm)}">
  <div class="s c">${esc(m.phone)}</div>
  <button onclick="saveProfile()">${t('save')}</button></div>
  <div class="card">${langSel()}<button class="x" onclick="logout()">${t('logout')}</button></div>`;
}

function mainView() {
  var b = S.tab === 'calls' ? callsTab() : S.tab === 'wallet' ? walletTab() : profileTab();
  var items = [['calls', '📞'], ['wallet', '🪙'], ['profile', '👤']];
  return (S.online ? '' : `<div class="ban">${t('offline')}</div>`) +
    `<div class="top"><span>Ethio Call</span><span class="pill">🪙 ${S.coins}</span></div><div class="pg">${b}</div>` +
    `<div class="nav">${items.map(function (i) { return `<div class="${S.tab === i[0] ? 'on' : ''}" onclick="go('${i[0]}')">${i[1]}<br>${t(i[0])}</div>`; }).join('')}</div>`;
}

function clock() {
  var s = Math.floor((Date.now() - S.call.t0) / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function callView() {
  var c = S.call, inc = c.state === 'incoming';
  return `<div class="ov"><div class="av">📞</div><div style="font-size:24px;font-weight:700">${esc(c.peer)}</div>
  <div>${inc ? t('incoming') : c.state === 'active' ? t('connected') : t('calling')}</div>
  <div id="clk" style="font-size:28px">${c.state === 'active' ? clock() : ''}</div>
  <div class="s" style="color:#94a3b8">${c.ice ? 'network: ' + esc(c.ice) : ''}</div>
  ${inc ? `<button class="g" onclick="acceptCall()">${t('accept')}</button><button class="r" onclick="rejectCall()">${t('reject')}</button>`
        : `<button class="x" onclick="toggleMute()">${c.muted ? t('unmute') : t('mute')}</button><button class="r" onclick="hangup()">${t('end')}</button>`}</div>`;
}

function render() {
  ['ph', 'cd', 'nm'].forEach(function (i) { var e = $(i); if (e) S['d_' + i] = e.value; });
  var h = S.loading ? '<div class="c" style="padding-top:30vh;font-size:20px">Ethio Call...</div>' : !S.me ? loginView() : mainView();
  if (S.call) h += callView();
  if (S.msg) h += `<div class="toast">${esc(S.msg)}</div>`;
  $('app').innerHTML = h;
}

/* ---------- login / profile / wallet actions ---------- */
async function sendCode() {
  var p = $('ph').value;
  var r = await api('/auth/request-otp', 'POST', {phone: p});
  if (r.ok) { S.otpSent = true; S.d_ph = p; S.devCode = r.devCode || ''; render(); }
  else toast(r.error || 'Error');
}

async function doLogin() {
  var r = await api('/auth/verify-otp', 'POST', {phone: S.d_ph, code: $('cd').value});
  if (!r.token) return toast(r.error || 'Error');
  S.token = r.token; localStorage.setItem('tk', r.token);
  S.loading = true; render();
  boot();
}

function logout() {
  localStorage.removeItem('tk');
  if (socket) socket.close();
  S.token = null; S.me = null; S.otpSent = false; S.loading = false; S.online = false;
  render();
}

async function loadWallet() {
  var r = await api('/wallet');
  if (r.coins !== undefined) { S.coins = r.coins; S.hist = r.history || []; }
}

async function buy(id) {
  var r = await api('/wallet/dev-buy', 'POST', {package_id: id});
  if (r.coins === undefined) return toast(r.error || 'Error');
  await loadWallet(); render();
}

function pickPhoto(inp) {
  var f = inp.files[0]; if (!f) return;
  var img = new Image();
  img.onload = function () {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var s = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
    S.photo = c.toDataURL('image/jpeg', 0.7);
    render();
  };
  img.src = URL.createObjectURL(f);
}

async function saveProfile() {
  var r = await api('/profile', 'PUT', {name: $('nm').value, avatar_url: S.photo || S.me.avatar_url || null});
  if (!r.id) return toast(r.error || 'Error');
  S.me = r; S.photo = null; S.d_nm = null;
  toast(t('saved'));
}

async function boot() {
  var me = await api('/me');
  if (!me || !me.id) { S.loading = false; return me && me.error === 'Network error' ? (S.msg = me.error, render()) : logout(); }
  S.me = me;
  await Promise.all([loadWallet(), api('/packages').then(function (p) { if (Array.isArray(p)) S.pkgs = p; }),
    api('/ice').then(function (i) { if (i.iceServers) iceServers = i.iceServers; })]);
  S.loading = false;
  connect();
  render();
}

/* ---------- calling ---------- */
function key(k) {
  if (k === '⌫') S.dial = S.dial.slice(0, -1);
  else if (S.dial.length < 16) S.dial += k;
  render();
}

async function media() {
  localStream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
}

function mkPeer() {
  pc = new RTCPeerConnection({iceServers: iceServers});
  localStream.getTracks().forEach(function (tr) { pc.addTrack(tr, localStream); });
  pc.ontrack = function (e) { $('remote').srcObject = e.streams[0]; $('remote').play().catch(function () {}); };
  pc.oniceconnectionstatechange = function () {
    if (S.call && pc) { S.call.ice = pc.iceConnectionState; render(); }
  };
  pc.onicecandidate = function (e) {
    if (e.candidate && S.call) socket.emit('webrtc:ice', {callId: S.call.id, candidate: e.candidate});
  };
}

async function flushIce() {
  for (var i = 0; i < pendingIce.length; i++) { try { await pc.addIceCandidate(pendingIce[i]); } catch (e) {} }
  pendingIce = [];
}

function tick() {
  clearInterval(tickT);
  tickT = setInterval(function () {
    var e = $('clk');
    if (e && S.call && S.call.state === 'active') e.textContent = clock();
  }, 500);
}

function cleanup() {
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(function (tr) { tr.stop(); }); localStream = null; }
  $('remote').srcObject = null;
  clearInterval(tickT); ringStop();
  S.call = null; pendingIce = [];
  render();
  loadWallet().then(render);
}

async function startCall() {
  if (!S.dial) return;
  unlock();
  if (!S.online) return toast(t('offline'));
  try {
    await media(); mkPeer();
    S.call = {state: 'ringing', peer: S.dial, id: null};
    addRecent(S.dial, 'out');
    socket.emit('call:start', {toPhone: S.dial});
    render();
  } catch (e) { toast(t('mic')); cleanup(); }
}

async function acceptCall() {
  ringStop();
  try {
    await media(); mkPeer();
    socket.emit('call:accept', {callId: S.call.id});
    S.call.state = 'active'; S.call.t0 = Date.now();
    render(); tick();
  } catch (e) {
    toast(t('mic'));
    socket.emit('call:reject', {callId: S.call.id});
    cleanup();
  }
}

function rejectCall() { socket.emit('call:reject', {callId: S.call.id}); cleanup(); }
function hangup() { socket.emit('call:end', {callId: S.call.id}); }

function toggleMute() {
  if (!localStream) return;
  var tr = localStream.getAudioTracks()[0];
  tr.enabled = !tr.enabled;
  S.call.muted = !tr.enabled;
  render();
}

function connect() {
  if (socket) socket.close();
  socket = io({auth: {token: S.token}});
  socket.on('connect', function () { S.online = true; render(); });
  socket.on('disconnect', function () { S.online = false; if (S.call) cleanup(); else render(); });
  socket.on('connect_error', function () { S.online = false; render(); });

  socket.on('call:ringing', function (d) { if (S.call) S.call.id = d.callId; });

  socket.on('call:incoming', function (d) {
    S.call = {state: 'incoming', peer: d.from.name ? d.from.name + ' (' + d.from.phone + ')' : d.from.phone, id: d.callId};
    addRecent(d.from.phone, 'in');
    ringStart(); render();
  });

  socket.on('call:accepted', async function () {
    if (!pc || !S.call) return;
    S.call.state = 'active'; S.call.t0 = Date.now();
    render(); tick();
    var offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('webrtc:offer', {callId: S.call.id, sdp: pc.localDescription});
  });

  socket.on('webrtc:offer', async function (d) {
    if (!pc) return;
    await pc.setRemoteDescription(d.sdp); await flushIce();
    var a = await pc.createAnswer();
    await pc.setLocalDescription(a);
    socket.emit('webrtc:answer', {callId: S.call.id, sdp: pc.localDescription});
  });

  socket.on('webrtc:answer', async function (d) {
    if (!pc) return;
    await pc.setRemoteDescription(d.sdp); await flushIce();
  });

  socket.on('webrtc:ice', async function (d) {
    if (!pc) return;
    if (pc.remoteDescription) { try { await pc.addIceCandidate(d.candidate); } catch (e) {} }
    else pendingIce.push(d.candidate);
  });

  socket.on('call:charged', function (d) { S.coins = d.balance; });
  socket.on('call:low_balance', function () { toast('⚠ ' + t('balance') + ' < 1'); });
  socket.on('call:ended', function (d) {
    var m = d.reason + ' · ' + d.seconds + 's · ' + d.coinsCharged + ' 🪙';
    cleanup(); toast(m);
  });
  socket.on('call:error', function (d) { cleanup(); toast(d.message); });
}

/* ---------- start ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
if (S.token) { S.loading = true; render(); boot(); } else render();
</script>
</body>
</html>
