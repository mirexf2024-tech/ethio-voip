.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#0f766e;color:#fff;font-weight:700}
.pill{background:#ffffff33;border-radius:99px;padding:4px 12px;font-size:14px}
.pg{padding:16px 16px 90px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
input,select{width:100%;font-size:17px;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0;background:#fff;color:#111}
button{font-size:17px;padding:13px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:600;width:100%;margin:6px 0}

.nav div{flex:1;text-align:center;padding:10px 0;font-size:12px;color:#6b7280;position:relative}
.nav .on{color:#0f766e;font-weight:700}
.nav .dot{position:absolute;top:4px;left:56%;background:#dc2626;color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{background:#fff;color:#111;border:1px solid #e5e7eb;font-size:22px;margin:0}
.num{font-size:26px;text-align:center;min-height:40px;letter-spacing:1px;word-break:break-all}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.row:last-child{border:0}
.row button{width:auto;padding:8px 16px;margin:0;flex:none}
.row .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:60vw}
.av{width:96px;height:96px;border-radius:50%;background:#99f6e4;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:38px;color:#0f766e;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:44px;height:44px;font-size:18px;margin:0;flex:none}
.big{font-size:38px;font-weight:800;text-align:center}
.s{font-size:13px;color:#6b7280}
.c{text-align:center}
.badge{background:#dc2626;color:#fff;border-radius:99px;padding:2px 8px;font-size:12px;flex:none}
.ov{position:fixed;inset:0;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;z-index:9}
.ov button{max-width:320px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:90%}
.ban{background:#f59e0b;color:#000;text-align:center;font-size:13px;padding:4px}
.chatv{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#e5ddd5;display:flex;flex-direction:column;z-index:5}
.chatv .top span{cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:10px}
.mr{display:flex;justify-content:flex-start}
.mr.me{justify-content:flex-end}
.b{max-width:82%;padding:8px 10px;border-radius:12px;margin:3px 0;background:#fff;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.mr.me .b{background:#d9fdd3}
.pic{max-width:100%;max-height:260px;border-radius:8px;display:block}
.ph{padding:30px 20px;background:#eee;border-radius:8px;text-align:center;color:#555}
.pl{background:#0f766e;font-size:15px;padding:8px 14px;width:auto;margin:0}
.comp{display:flex;gap:6px;align-items:center;padding:8px;background:#f0f0f0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.comp input{margin:0;flex:1;min-width:0}
.comp button{width:auto;margin:0;padding:11px 14px;flex:none}
.ic{font-size:24px;padding:4px;cursor:pointer}

function b64ToU8(b64) {
  var pad = '='.repeat((4 - b64.length % 4) % 4);
  var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
function pushReady() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function swReady() {
  return Promise.race([navigator.serviceWorker.ready, new Promise(function (_, rej) { setTimeout(rej, 5000); })]);
}
// subscribe this phone to push (only if the user already allowed notifications)
async function pushOn() {
  if (!pushReady() || Notification.permission !== 'granted') return false;
  try {
    var reg = await swReady();
    var sub = await reg.pushManager.getSubscription();
    if (!sub) {
      var k = await (await fetch('/push/key')).json();
      if (!k.key) return false;
      sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64ToU8(k.key)});
    }
    var r = await api('/push/subscribe', 'POST', {subscription: sub.toJSON()});
    return !!r.ok;
  } catch (e) { return false; }
}
// forget this phone (used when logging out, so the next person does not get your calls)
async function pushOff() {
  if (!pushReady()) return;
  try {
    var reg = await swReady();
    var sub = await reg.pushManager.getSubscription();
    if (sub) { await api('/push/unsubscribe', 'POST', {endpoint: sub.endpoint}); await sub.unsubscribe(); }
  } catch (e) {}
}
async function askNotif() {
  if (!pushReady()) return toast('Not supported');
  var p = await Notification.requestPermission();
  if (p !== 'granted') { toast(t('off')); return render(); }
  var ok = await pushOn();
  toast(ok ? t('on') : t('notifFail'));
}
async function testPush() {
  var r = await api('/push/test', 'POST');
  toast(r.sent ? t('on') : t('notifFail'));
}

// Chrome on Android can read the code from the SMS by itself (asks you once)
function startWebOtp() {
  if (!('OTPCredential' in window)) return;
  try {
    var ac = new AbortController();
    setTimeout(function () { ac.abort(); }, 120000);
    navigator.credentials.get({otp: {transport: ['sms']}, signal: ac.signal}).then(function (o) {
      if (o && o.code) { S.d_cd = o.code; render(); doLogin(); }
    }).catch(function () {});
  } catch (e) {}
}

async function doLogin() {
  var r = await api('/auth/verify-otp', 'POST', {phone: S.d_ph, code: $('cd').value});
  if (!r.token) return toast(r.error || 'Error');
  S.token = r.token; localStorage.setItem('tk', r.token);
  S.loading = true; render();
  boot();
}

  await pushOff();
  localStorage.removeItem('tk');
  if (socket) socket.close();
  S.token = null; S.me = null; S.otpSent = false; S.loading = false; S.online = false;
  S.chat = null; S.chats = []; S.blocks = []; S.call = null;

function pickPhoto(inp) {
  var f = inp.files[0]; if (!f) return;
  var img = new Image();
  img.onload = function () {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var s = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
    S.photo = c.toDataURL('image/jpeg', 0.7);
    render();
  };
  img.src = URL.createObjectURL(f);
}

  var me = await api('/me');
  if (!me || !me.id) { S.loading = false; return me && me.error === 'Network error' ? (S.msg = me.error, render()) : logout(); }
  S.me = me;
  await Promise.all([loadWallet(), loadBlocks(),
    api('/chats').then(function (c) { if (Array.isArray(c)) S.chats = c; }),
    api('/packages').then(function (p) { if (Array.isArray(p)) S.pkgs = p; }),
    api('/pay-info').then(function (i) { if (i && i.method) S.payInfo = i; }),
    loadReqs(),
    api('/ice').then(function (i) { if (i.iceServers) iceServers = i.iceServers; })]);
  S.loading = false;
  connect();
  render();
  pushOn();
}

  M[id] = URL.createObjectURL(await r.blob());

async function postMsg(payload, blob) {
  var r = await api('/messages/send', 'POST', Object.assign({to: S.chat.phone}, payload));
  if (!r.ok) return toast(r.error || 'Error');
  if (blob) M[r.msg.id] = URL.createObjectURL(blob);
  S.chat.messages.push(Object.assign({mine: true}, r.msg));
  S.stick = true; renderMsgs(); loadChats();
}

function sendText() {
  var e = $('mi'); if (!e) return;
  var v = e.value.trim(); if (!v) return;
  e.value = ''; S.d_mi = '';
  postMsg({kind: 'text', body: v});
}

function toDataURL(b) {
  return new Promise(function (res, rej) {
    var f = new FileReader(); f.onload = function () { res(f.result); }; f.onerror = rej; f.readAsDataURL(b);
  });
}

function compressImage(f) {
  return new Promise(function (res, rej) {
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, 1280 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { b ? res(b) : rej(new Error('img')); }, 'image/jpeg', 0.7);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = rej; img.src = URL.createObjectURL(f);
  });
}

async function pickFile(inp, kind) {
  var f = inp.files[0]; inp.value = ''; if (!f) return;
  try {
    var blob = f, k = 'file';
    if (kind === 'image' && f.type.indexOf('image/') === 0) { blob = await compressImage(f); k = 'image'; }
    if (blob.size > 1000000) return toast(t('tooBig'));
    toast(t('sending'));
    await postMsg({kind: k, data: await toDataURL(blob), name: f.name, size: blob.size}, blob);
  } catch (e) { toast('Error'); }
}

async function voiceStart() {
  if (S.call) return toast(t('mic'));
  try { VR.stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch (e) { return toast(t('mic')); }
  var mt = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(function (m) {
    return window.MediaRecorder && MediaRecorder.isTypeSupported(m);
  });
  var opts = {audioBitsPerSecond: 24000}; if (mt) opts.mimeType = mt;
  VR.mr = new MediaRecorder(VR.stream, opts);
  VR.chunks = []; VR.cancel = false;
  VR.mr.ondataavailable = function (e) { if (e.data && e.data.size) VR.chunks.push(e.data); };
  VR.mr.onstop = async function () {
    VR.stream.getTracks().forEach(function (tr) { tr.stop(); });
    clearInterval(VR.timer); S.recording = false;
    var secs = (Date.now() - VR.t0) / 1000;
    render();
    if (VR.cancel || !VR.chunks.length || !S.chat) return;
    var blob = new Blob(VR.chunks, {type: VR.mr.mimeType || 'audio/webm'});
    if (blob.size > 1000000) return toast(t('tooBig'));
    await postMsg({kind: 'voice', data: await toDataURL(blob), size: blob.size, duration: Math.round(secs)}, blob);
  };
  VR.mr.start(); VR.t0 = Date.now(); S.recording = true; render();
  VR.timer = setInterval(function () {
    var e = $('rt'), ms = Date.now() - VR.t0;
    if (e) e.textContent = fmtDur(ms / 1000);
    if (ms > 120000) voiceStop(false);
  }, 500);
}
function voiceStop(cancel) {
  VR.cancel = !!cancel;
  if (VR.mr && VR.mr.state !== 'inactive') VR.mr.stop();
}

/* ---------- calling ---------- */
function key(k) {
  if (k === '⌫') S.dial = S.dial.slice(0, -1);
  else if (S.dial.length < 16) S.dial += k;
  render();
}

async function media() {
  localStream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
}

function mkPeer() {
  pc = new RTCPeerConnection({iceServers: iceServers});
  localStream.getTracks().forEach(function (tr) { pc.addTrack(tr, localStream); });
  pc.ontrack = function (e) { $('remote').srcObject = e.streams[0]; $('remote').play().catch(function () {}); };
  pc.oniceconnectionstatechange = function () {
    if (S.call && pc) { S.call.ice = pc.iceConnectionState; render(); }
  };
  pc.onicecandidate = function (e) {
    if (e.candidate && S.call) socket.emit('webrtc:ice', {callId: S.call.id, candidate: e.candidate});
  };
}

async function flushIce() {
  for (var i = 0; i < pendingIce.length; i++) { try { await pc.addIceCandidate(pendingIce[i]); } catch (e) {} }
  pendingIce = [];
}

// low-data mode: ~16 kbps voice (about 0.12 MB per minute); otherwise 32 kbps
function limitBitrate() {
  try {
    pc.getSenders().forEach(function (sd) {
      if (!sd.track || sd.track.kind !== 'audio') return;
      var p = sd.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      p.encodings[0].maxBitrate = S.set.saver ? 16000 : 32000;
      sd.setParameters(p).catch(function () {});
    });
  } catch (e) {}
}

function tick() {
  clearInterval(tickT);
  tickT = setInterval(function () {
    var e = $('clk');
    if (e && S.call && S.call.state === 'active') e.textContent = clock();
  }, 500);
}

function cleanup() {
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(function (tr) { tr.stop(); }); localStream = null; }
  $('remote').srcObject = null;
  clearInterval(tickT); ringStop(); rbStop();
  S.call = null; pendingIce = [];
  render();
  loadWallet().then(render);
}

async function startCall() {
  if (!S.dial) return;
  unlock();
  if (!S.online) return toast(t('offline'));
  try {
    await media(); mkPeer();
    S.call = {state: 'ringing', peer: S.dial, id: null, role: 'caller'};
    addRecent(S.dial, 'out');
    socket.emit('call:start', {toPhone: S.dial});
    rbStart();
    render();
  } catch (e) { toast(t('mic')); cleanup(); }
}

async function acceptCall() {
  ringStop();
  try {
    await media(); mkPeer();
    socket.emit('call:accept', {callId: S.call.id});
    S.call.state = 'active'; S.call.t0 = Date.now();
    render(); tick();
  } catch (e) {
    toast(t('mic'));
    socket.emit('call:reject', {callId: S.call.id});
    cleanup();
  }
}

function rejectCall() { socket.emit('call:reject', {callId: S.call.id}); cleanup(); }
function hangup() { socket.emit('call:end', {callId: S.call.id}); }

function toggleMute() {
  if (!localStream) return;
  var tr = localStream.getAudioTracks()[0];
  tr.enabled = !tr.enabled;
  S.call.muted = !tr.enabled;
  render();
}

function connect() {
  if (socket) socket.close();
  socket = io({auth: {token: S.token}});
  socket.on('connect', function () { S.online = true; render(); });
  socket.on('disconnect', function () { S.online = false; if (S.call) cleanup(); else render(); });
  socket.on('connect_error', function () { S.online = false; render(); });

  // messages
  socket.on('msg:new', function (m) {
    if (S.chat && S.chat.phone === m.from_phone) {
      S.chat.messages.push(Object.assign({mine: false}, m));
      socket.emit('msg:read', {phone: m.from_phone});
      renderMsgs();
    } else {
      if (S.set.sound) beep(0.15);
      buzz(100);
    }
    if (document.hidden) notify(m.from_name || m.from_phone, m.kind === 'text' ? m.body : preview(m));
    loadChats();
  });
  socket.on('msg:read', function (d) {
    if (S.chat && S.chat.phone === d.phone) {
      S.chat.messages.forEach(function (m) { if (m.mine && !m.read_at) m.read_at = new Date().toISOString(); });
      renderMsgs();
    }
  });

  // calls
  socket.on('call:ringing', function (d) { if (S.call) { S.call.id = d.callId; S.call.reach = d.reach; render(); } });

  socket.on('call:incoming', function (d) {
    S.call = {role: 'callee', state: 'incoming', peer: d.from.name ? d.from.name + ' (' + d.from.phone + ')' : d.from.phone, id: d.callId};
    addRecent(d.from.phone, 'in');
    ringStart(); render();
    notify(t('incoming'), d.from.name || d.from.phone);
  });

  socket.on('call:accepted', async function () {
    if (!pc || !S.call) return;
    rbStop();
    S.call.state = 'active'; S.call.t0 = Date.now();
    render(); tick();
    var offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    limitBitrate();
    socket.emit('webrtc:offer', {callId: S.call.id, sdp: pc.localDescription});
  });

  socket.on('webrtc:offer', async function (d) {
    if (!pc) return;
    await pc.setRemoteDescription(d.sdp); await flushIce();
    var a = await pc.createAnswer();
    await pc.setLocalDescription(a);
    limitBitrate();
    socket.emit('webrtc:answer', {callId: S.call.id, sdp: pc.localDescription});
  });

  socket.on('webrtc:answer', async function (d) {
    if (!pc) return;
    await pc.setRemoteDescription(d.sdp); await flushIce();
  });

  socket.on('webrtc:ice', async function (d) {
    if (!pc) return;
    if (pc.remoteDescription) { try { await pc.addIceCandidate(d.candidate); } catch (e) {} }
    else pendingIce.push(d.candidate);
  });

  socket.on('call:charged', function (d) { S.coins = d.balance; });
  socket.on('wallet:update', function (d) {
    S.coins = d.coins;
    if (S.set.sound) beep(0.3);
    loadWallet().then(loadReqs).then(function () { render(); toast('+' + d.added + ' 🪙', 5000); });
  });
  socket.on('call:low_balance', function () { toast('⚠ ' + t('balance') + ' < 1'); });
  socket.on('call:ended', function (d) {
    var m = d.reason + ' · ' + d.seconds + 's · ' + d.coinsCharged + ' 🪙';
    var caller = S.call && S.call.role === 'caller';
    var key = {no_answer: 'no_answer', rejected: 'rejected', unreachable: 'offline', no_coins: 'no_coins'}[d.reason];
    cleanup();
    if (caller && key) announce(key); else toast(m);
  });
  socket.on('call:error', function (d) {
    cleanup();
    if (d.code) announce(d.code); else toast(d.message);
  });
}

/* ---------- start ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
if (S.token) { S.loading = true; render(); boot(); } else render();
</script>
